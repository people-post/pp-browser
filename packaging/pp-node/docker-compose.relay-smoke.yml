# L2 / N-FANOUT dogfood topology for pp-node.
# Hop runs in Docker; two media clients run in-process via pp-node-probe --mode=media-fanout
# on the host (see scripts/pp_node_fanout_smoke.sh). This avoids shipping client images while
# still exercising a separate process/network namespace for the hop.
#
# Usage (from repo root):
#   ./scripts/pp_local_test.sh run --suite node
#   # or manual:
#   docker compose -f packaging/pp-node/docker-compose.relay-smoke.yml up -d --build
#   cmake --build build --target pp-node-probe -j
#   ./scripts/pp_node_fanout_smoke.sh
#
# See IMAGE_SMOKE.md and docs/ops/TEST_STRATEGY.md (N-FANOUT).

services:
  hop:
    build:
      context: ../../dist/pp-node/docker
      dockerfile: Dockerfile
    image: pp-node:local
    container_name: pp-node-relay-smoke-hop
    restart: unless-stopped
    environment:
      PP_BROWSER_PIN: ${PP_BROWSER_PIN:-local-test-pin}
      PP_NODE_AMP_UDP_PORT: ${PP_NODE_AMP_UDP_PORT:-18517}
      PP_NODE_DATA_DIR: /var/lib/pp-node
      PP_NODE_STATUS_ADDR: ${PP_NODE_STATUS_ADDR:-0.0.0.0:18518}
      # Volunteer-style caps for probe strangers (override to exercise N-ADMIT later).
      PP_NODE_CAP_CIRCUIT_RELAY: ${PP_NODE_CAP_CIRCUIT_RELAY:-1}
      PP_NODE_CAP_MEDIA_RELAY: ${PP_NODE_CAP_MEDIA_RELAY:-1}
    volumes:
      - pp-node-relay-smoke-data:/var/lib/pp-node
    ports:
      - "${PP_NODE_HOST_PORT:-18517}:18517/udp"
      - "${PP_NODE_STATUS_HOST_PORT:-18518}:18518"

volumes:
  pp-node-relay-smoke-data:
