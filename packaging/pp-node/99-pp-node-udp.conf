# pp-node: let the node's UDP socket hold bursts (it asks for 8 MiB receive and send buffers; Linux grants at most
# these). Without it a busy node's kernel drops datagrams while the pump works (docs/ops/STRESS_LAB.md).
# Install: cp 99-pp-node-udp.conf /etc/sysctl.d/ && sysctl --system
# Docker: these are host settings (not per container) — set them on the host.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
