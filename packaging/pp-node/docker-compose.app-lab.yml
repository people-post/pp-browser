# App lab: the real relay for pp-app-probe runs — the relay backend (pp-relay-apis: the registry, messenger, storage
# and push functions, the LLM gateway) as its local stack, the paths and checks of its CDN in front — and the lab's
# own mesh seed: the product's messaging, control lane and AutoKey sessions over the relay the app uses in production.
# The relay services extend pp-relay-apis's local-stack/compose.yaml and its image builds from that checkout:
# PP_RELAY_APIS_ROOT (default ../pp-relay-apis beside this repository; pp_local_test.sh finds it beside the main
# checkout, so a worktree needs nothing set).
#
#   PP_RELAY_APIS_ROOT=/path/to/pp-relay-apis docker compose -f docker-compose.app-lab.yml -p pp-app-lab up -d --build
#
# No fixed container names and no database host ports: it never collides with a developer's own relay stack. The
# relay (its API, its presigned object URLs and the harness's /healthz and /_local/*) is published on
# 127.0.0.1:${PP_APP_LAB_RELAY_PORT:-18719}; its DynamoDB and S3 servers are private to it. Stopping the relay
# container stops everything the relay serves.
#
# A second, independent relay stack (relay2 + relay2-dynamodb + relay2-s3, on 127.0.0.1:${PP_APP_LAB_RELAY2_PORT:-18729})
# is for the multi-relay scenarios: users on different relays, one user on both, the preferred one stopped. Each
# relay also has TLS in front (tls-a on 127.0.0.1:${PP_APP_LAB_TLS_A_PORT:-18743}, tls-b on
# 127.0.0.1:${PP_APP_LAB_TLS_B_PORT:-18744}): account cards list https:// relays only (MR004). Its certificate is
# signed by a lab CA that pp_local_test.sh makes in PP_APP_LAB_TLS_DIR; the probes trust it through
# PP_BROWSER_CA_BUNDLE. The fronts also serve each relay's icon CDN (https://198.51.100.21/_local/cdn, …22).
#
# The lab's own mesh seed (pp-node, image pp-node:local as staged by pp_local_test.sh) sits on a
# TEST-NET-2 network: the product dials seeds only on public addresses, and 198.51.100.0/24 reads
# as one while the host still routes to it. Its /status is on 127.0.0.1:${PP_APP_LAB_HOP_STATUS_PORT:-18718}.
x-relay-stack: &relay-stack
  file: ${PP_RELAY_APIS_ROOT:-../../../pp-relay-apis}/local-stack/compose.yaml

services:
  hop:
    build:
      context: ../../dist/pp-node/docker
      dockerfile: Dockerfile
    image: pp-node:local
    environment:
      PP_BROWSER_PIN: local-test-pin
      # A fixed identity, as org seeds have (PP_NODE_IDENTITY_SEED): the seed has no volume, and a new identity on
      # every recreate left the old one in the lab directory at the same address — clients dialed it and failed
      # ("authenticated peer id does not match"), and calls through the seed with them.
      PP_NODE_IDENTITY_SEED: "a1ab5eed00000000000000000000000000000000000000000000000000000001"
      PP_NODE_AMP_UDP_PORT: 18517
      PP_NODE_DATA_DIR: /var/lib/pp-node
      PP_NODE_STATUS_ADDR: 0.0.0.0:18518
      PP_NODE_CAP_CIRCUIT_RELAY: 1
      PP_NODE_CAP_MEDIA_RELAY: 1
      # Small, so pp-node-load can fill it (full_seed_parks_elsewhere, full_hop_hosts_the_call_elsewhere).
      PP_NODE_CAPACITY_RESERVATIONS: ${PP_APP_LAB_HOP_RESERVATIONS:-24}
      PP_NODE_CAPACITY_GROUP_CALLS: ${PP_APP_LAB_HOP_GROUP_CALLS:-8}
      # Listed in the lab directory as a mesh node, as prod's seeds are (#385): its address carries its
      # PeerId, so pp_local_test.sh passes it in once the seed has one (PP_APP_LAB_HOP_ADVERTISE).
      PP_NODE_ADVERTISE_MULTIADDRS: ${PP_APP_LAB_HOP_ADVERTISE:-}
      PP_NODE_MESH_PUBLISH: ${PP_APP_LAB_HOP_PUBLISH:-false}
      PP_NODE_REGISTRATION_BASE_URL: http://198.51.100.20:9097/api/relay
      # The relay id that relay proves (SIGNED_FORMATS § 3: a relay address is its origin and its relay id), as the
      # fleet's config names it: pp_local_test.sh reads it from the relay's /_local/status once the relay is up
      # (PP_APP_LAB_RELAY_ID) and starts the seeds again with it. Empty until then: a developer build pins the relay's
      # first valid certificate.
      PP_NODE_REGISTRATION_RELAY_ID: ${PP_APP_LAB_RELAY_ID:-}
      # As the fleet runs it: the relay's CDN refuses a POST without x-amz-content-sha256.
      PP_NODE_RELAY_CONTENT_SHA256: "true"
      PP_NODE_LOG_LEVEL: ${PP_APP_LAB_HOP_LOG_LEVEL:-info}
      # Never the production seeds (the default when none is set): a lab hop probing them loads
      # them, and their dial-backs fill its pending-handshake slots. TEST-NET-3: nothing answers.
      PP_NODE_BOOTSTRAP_PEERS: /ip4/203.0.113.1/udp/443/adp/2/p2p/QmW6e19wEv2FozTzQXxCee7USqQLE7HAvcF77es4brdSWd
    networks:
      lab:
        ipv4_address: 198.51.100.10
    ports:
      - "127.0.0.1:${PP_APP_LAB_HOP_STATUS_PORT:-18718}:18518"

  # A second seed, for the scenarios where a user is near its own relay (call_path_*_two_hops): the same image
  # and settings as hop, on 198.51.100.30, /status on 127.0.0.1:${PP_APP_LAB_HOP2_STATUS_PORT:-18728}. Not in
  # the lab directory: only users given it as a bootstrap seed know it, so other scenarios still see one seed.
  hop2:
    image: pp-node:local
    environment:
      PP_BROWSER_PIN: local-test-pin
      PP_NODE_IDENTITY_SEED: "a1ab5eed00000000000000000000000000000000000000000000000000000002"
      PP_NODE_AMP_UDP_PORT: 18517
      PP_NODE_DATA_DIR: /var/lib/pp-node
      PP_NODE_STATUS_ADDR: 0.0.0.0:18518
      PP_NODE_CAP_CIRCUIT_RELAY: 1
      PP_NODE_CAP_MEDIA_RELAY: 1
      PP_NODE_ADVERTISE_MULTIADDRS: ${PP_APP_LAB_HOP2_ADVERTISE:-}
      PP_NODE_MESH_PUBLISH: ${PP_APP_LAB_HOP2_PUBLISH:-false}
      PP_NODE_REGISTRATION_BASE_URL: http://198.51.100.20:9097/api/relay
      PP_NODE_REGISTRATION_RELAY_ID: ${PP_APP_LAB_RELAY_ID:-}
      # As the fleet runs it: the relay's CDN refuses a POST without x-amz-content-sha256.
      PP_NODE_RELAY_CONTENT_SHA256: "true"
      PP_NODE_LOG_LEVEL: ${PP_APP_LAB_HOP_LOG_LEVEL:-info}
      PP_NODE_BOOTSTRAP_PEERS: /ip4/203.0.113.1/udp/443/adp/2/p2p/QmW6e19wEv2FozTzQXxCee7USqQLE7HAvcF77es4brdSWd
    networks:
      lab:
        ipv4_address: 198.51.100.30
    ports:
      - "127.0.0.1:${PP_APP_LAB_HOP2_STATUS_PORT:-18728}:18518"
    depends_on: [hop]

  # The first relay. Its address is fixed: users behind the NAT overlay (docker-compose.app-lab-nat.yml) reach it
  # there, and it is the S3 endpoint of its functions, so presigned URLs name it (the host routes to it too).
  relay:
    extends: { <<: *relay-stack, service: relay }
    environment:
      LOCAL_PORT: 9097
      LOCAL_PUBLIC_URL: http://198.51.100.20:9097
      # Every origin the lab's clients use for this relay, which its certificate lists (SIGNED_FORMATS § 3.5): a client
      # refuses the relay at an origin it does not (origin_not_listed). The NAT users' and the seeds' address, the
      # host users' port mapping, and the TLS front's (the multi-relay scenarios and relay links).
      LOCAL_RELAY_ORIGINS: http://198.51.100.20:9097/api/relay,http://127.0.0.1:${PP_APP_LAB_RELAY_PORT:-18719}/api/relay,https://127.0.0.1:${PP_APP_LAB_TLS_A_PORT:-18743}/api/relay
      LOCAL_CDN_ORIGIN: https://198.51.100.21/_local/cdn
      LOCAL_DYNAMODB_ENDPOINT: http://relay-dynamodb:8000
      LOCAL_S3_ENDPOINT: http://relay-s3:7070
    networks:
      lab:
        ipv4_address: 198.51.100.20
    ports: !override
      - "127.0.0.1:${PP_APP_LAB_RELAY_PORT:-18719}:9097"
    depends_on: !override
      relay-dynamodb: { condition: service_started, restart: true }
      relay-s3: { condition: service_started, restart: true }

  relay-dynamodb:
    extends: { <<: *relay-stack, service: dynamodb }
    networks: [lab]

  relay-s3:
    extends: { <<: *relay-stack, service: s3 }
    networks: [lab]

  # TLS in front of the first relay: https://127.0.0.1:${PP_APP_LAB_TLS_A_PORT:-18743}/api/relay.
  tls-a:
    image: public.ecr.aws/docker/library/node:lts-alpine
    command: ["node", "/proxy/proxy.js", "443", "relay", "9097"]
    volumes:
      - ./app-lab-tls/proxy.js:/proxy/proxy.js:ro
      - ${PP_APP_LAB_TLS_DIR:-/tmp/pp-app-lab-tls}:/tls:ro
      # Lab-only request recording (MR007's replay scenario): on while ${PP_APP_LAB_TLS_RECORD_DIR}/a/on exists.
      - ${PP_APP_LAB_TLS_RECORD_DIR:-/tmp/pp-app-lab-tls-record}:/record
    environment:
      RECORD_DIR: /record/a
    networks:
      lab:
        ipv4_address: 198.51.100.21
    ports:
      - "127.0.0.1:${PP_APP_LAB_TLS_A_PORT:-18743}:443"
    depends_on: [relay]

  # The second relay: a stack of its own (its own tables and objects), as another operator's would be.
  relay2:
    extends: { <<: *relay-stack, service: relay }
    environment:
      LOCAL_PORT: 9097
      LOCAL_PUBLIC_URL: http://198.51.100.23:9097
      LOCAL_RELAY_ORIGINS: http://198.51.100.23:9097/api/relay,http://127.0.0.1:${PP_APP_LAB_RELAY2_PORT:-18729}/api/relay,https://127.0.0.1:${PP_APP_LAB_TLS_B_PORT:-18744}/api/relay
      LOCAL_CDN_ORIGIN: https://198.51.100.22/_local/cdn
      LOCAL_DYNAMODB_ENDPOINT: http://relay2-dynamodb:8000
      LOCAL_S3_ENDPOINT: http://relay2-s3:7070
    networks:
      lab:
        ipv4_address: 198.51.100.23
    ports: !override
      - "127.0.0.1:${PP_APP_LAB_RELAY2_PORT:-18729}:9097"
    depends_on: !override
      relay2-dynamodb: { condition: service_started, restart: true }
      relay2-s3: { condition: service_started, restart: true }

  relay2-dynamodb:
    extends: { <<: *relay-stack, service: dynamodb }
    networks: [lab]

  relay2-s3:
    extends: { <<: *relay-stack, service: s3 }
    networks: [lab]

  # TLS in front of the second relay: https://127.0.0.1:${PP_APP_LAB_TLS_B_PORT:-18744}/api/relay.
  tls-b:
    image: public.ecr.aws/docker/library/node:lts-alpine
    command: ["node", "/proxy/proxy.js", "443", "relay2", "9097"]
    volumes:
      - ./app-lab-tls/proxy.js:/proxy/proxy.js:ro
      - ${PP_APP_LAB_TLS_DIR:-/tmp/pp-app-lab-tls}:/tls:ro
      # Lab-only request recording (MR007's replay scenario): on while ${PP_APP_LAB_TLS_RECORD_DIR}/b/on exists.
      - ${PP_APP_LAB_TLS_RECORD_DIR:-/tmp/pp-app-lab-tls-record}:/record
    environment:
      RECORD_DIR: /record/b
    networks:
      lab:
        ipv4_address: 198.51.100.22
    ports:
      - "127.0.0.1:${PP_APP_LAB_TLS_B_PORT:-18744}:443"
    depends_on: [relay2]

networks:
  lab:
    ipam:
      config:
        - subnet: 198.51.100.0/24
