name: Free disk space
description: Reclaim space on GitHub-hosted Ubuntu runners before heavy builds

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        set -euo pipefail
        echo "=== disk before cleanup ==="
        df -h

        # Large preinstalled toolchains unused by pp-browser CI.
        # Android SDK is reinstalled by android-actions/setup-android when needed.
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/share/boost \
          /usr/share/swift \
          /usr/local/.ghcup \
          /usr/share/miniconda \
          /usr/local/share/chromium \
          /usr/local/share/powershell \
          /opt/hostedtoolcache/CodeQL \
          || true

        # setup-android installs into ANDROID_SDK_ROOT (/usr/local/lib/android/sdk on
        # Ubuntu runners). After deleting that tree, recreate a writable parent —
        # the runner user cannot mkdir under /usr/local/lib (EACCES).
        sudo mkdir -p /usr/local/lib/android
        sudo chmod a+rwx /usr/local/lib/android

        sudo docker system prune -af || true
        sudo apt-get clean || true
        sudo rm -rf /var/lib/apt/lists/* || true

        echo "=== disk after cleanup ==="
        df -h
