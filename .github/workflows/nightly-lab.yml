name: nightly-lab

# The app lab every night on main (docs/ops/TEST_STRATEGY.md § Nightly lab): `--suite app` and
# `--suite app-nat` on a CodeBuild-hosted runner (lab-run.yml: build, run, report). A scenario that fails twice (one
# retry) opens or updates an issue labelled nightly-lab; one that passes again closes it.
#
# Never on pull requests: the lab runs only what this workflow, from the default branch, gives it. Idle (a notice)
# until the secret PP_LAB_RELAY_APIS_DEPLOY_KEY (a read-only deploy key of people-post/pp-relay-apis, which is private) is set.

on:
  schedule:
    - cron: '17 7 * * *' # 07:17 UTC, past midnight in California
  workflow_dispatch:
    inputs:
      runner:
        description: 'Where the lab runs (empty: the repository variable PP_LAB_RUNNER, else codebuild)'
        type: choice
        options: ['', codebuild, github]
        default: ''
      suites:
        description: 'Suites to run (space-separated)'
        default: 'app app-nat'
      only:
        description: 'Scenarios only (space-separated; empty: all)'
        default: ''
      tags:
        description: 'Scenarios with any of these tags (a,b; empty: all)'
        default: ''

permissions:
  contents: read

concurrency:
  group: nightly-lab
  cancel-in-progress: false

jobs:
  lab:
    permissions:
      contents: read
      issues: write # one issue per failing scenario
    uses: ./.github/workflows/lab-run.yml
    secrets: inherit
    with:
      name: Nightly lab
      artifact: nightly-lab
      suites: ${{ inputs.suites || 'app app-nat' }}
      only: ${{ inputs.only || '' }}
      tags: ${{ inputs.tags || '' }}
      issues: true
      runner: ${{ inputs.runner || '' }}
