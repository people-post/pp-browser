name: nightly-lab

# The app lab every night on main (docs/ops/TEST_STRATEGY.md § Nightly lab): `--suite app` and
# `--suite app-nat` on the lab machine — a self-hosted EC2 runner that is stopped except while a lab run
# runs (lab-run.yml: start, build, run, report, stop). A scenario that fails twice (one retry) opens or updates an issue
# labelled nightly-lab; one that passes again closes it.
#
# Never on pull requests: the lab machine runs only what this workflow, from the default branch, gives
# it. Idle (a notice) until the repository variables PP_LAB_INSTANCE_ID and PP_LAB_AWS_ROLE and the
# secret PP_LAB_RELAY_APIS_TOKEN (read access to people-post/pp-relay-apis, which is private) are set.

on:
  schedule:
    - cron: '17 7 * * *' # 07:17 UTC, past midnight in California
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suites to run (space-separated)'
        default: 'app app-nat'
      only:
        description: 'Scenarios only (space-separated; empty: all)'
        default: ''
      tags:
        description: 'Scenarios with any of these tags (a,b; empty: all)'
        default: ''

permissions:
  contents: read

concurrency:
  group: nightly-lab
  cancel-in-progress: false

jobs:
  lab:
    permissions:
      contents: read
      id-token: write # the hosted jobs start and stop the lab machine (OIDC role)
      issues: write # one issue per failing scenario
      actions: read # the stop job looks for other lab runs still on the machine
    uses: ./.github/workflows/lab-run.yml
    secrets: inherit
    with:
      name: Nightly lab
      artifact: nightly-lab
      suites: ${{ inputs.suites || 'app app-nat' }}
      only: ${{ inputs.only || '' }}
      tags: ${{ inputs.tags || '' }}
      issues: true
