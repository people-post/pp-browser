name: release

# App installers only (macOS / Windows / Android). pp-node: release-pp-node.yml + pp-node/v* tags.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  INSTALL_PREFIX: ${{ github.workspace }}/install

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tag commit on main (release line)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::App release tags (v*) must point at a commit on origin/main."
            exit 1
          fi

  macos:
    needs: [guard]
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install macOS deps
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi

      - name: Ensure ccache directory exists
        run: |
          mkdir -p "$HOME/.cache/ccache"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macOS-ccache-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/release.yml') }}
          restore-keys: |
            macOS-ccache-v1-

      - name: ccache stats (pre-build)
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="${RELEASE_VERSION%%-*}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "project_version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaging pp-browser ${RELEASE_VERSION} for macOS"

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_COMPILER_CACHE=ON \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DPP_BROWSER_VERSION="${{ steps.version.outputs.project_version }}" \
            -DPP_BROWSER_RELEASE_VERSION="${{ steps.version.outputs.release_version }}" \
            -DPP_BROWSER_PACKAGED_BUILD=ON

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build

      - name: Check no Homebrew dylib linkage
        run: ./scripts/macos_check_bundled_linkage.sh "${INSTALL_PREFIX}/PP.app"

      - name: Sign macOS app
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/macos_sign_and_notarize.sh sign-app "${INSTALL_PREFIX}/PP.app"

      - name: Package
        shell: bash
        run: |
          detach_stale_volume() {
            for mount in /Volumes/pp-browser /Volumes/pp-browser-*; do
              if [ -d "$mount" ]; then
                echo "Detaching stale mount: $mount"
                hdiutil detach "$mount" -force || true
              fi
            done
          }

          detach_stale_volume

          attempts=0
          max_attempts=3
          until (cd build && cpack -G DragNDrop); do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "::error::cpack DragNDrop failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "::warning::cpack DragNDrop attempt ${attempts} failed; retrying in 5s"
            detach_stale_volume
            rm -f build/*.dmg
            sleep 5
          done

          dmg="$(find build -maxdepth 2 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg produced under build/"
            find build -name '*.dmg' -o -name '_CPack_Packages' -type d | head -50
            exit 1
          fi
          echo "Packaged ${dmg}"
          echo "dmg_path=${dmg}" >> "$GITHUB_ENV"

      - name: Verify signed app inside DMG
        run: |
          set -euo pipefail
          mnt="$(mktemp -d "${RUNNER_TEMP}/pp-dmg.XXXXXX")"
          cleanup() { hdiutil detach "$mnt" -force >/dev/null 2>&1 || true; rm -rf "$mnt"; }
          trap cleanup EXIT
          hdiutil attach "${dmg_path}" -readonly -nobrowse -mountpoint "$mnt"
          app="$(find "$mnt" -maxdepth 2 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::No .app in DMG"
            ls -la "$mnt"
            exit 1
          fi
          echo "Verifying ${app}"
          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign -dv --verbose=2 "$app" 2>&1 || true)"
          echo "$details"
          echo "$details" | grep -q "Authority=Developer ID Application" \
            || { echo "::error::DMG app is not Developer ID–signed (cpack may have re-installed unsigned)"; exit 1; }

      - name: Notarize and staple DMG
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_P8_BASE64: ${{ secrets.APPLE_NOTARY_P8_BASE64 }}
        run: |
          ./scripts/macos_sign_and_notarize.sh notarize "${dmg_path}"
          ./scripts/macos_sign_and_notarize.sh staple "${dmg_path}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-installer
          path: build/*.dmg
          if-no-files-found: error

      - name: ccache stats (post-build)
        run: ccache --show-stats || true

  windows:
    needs: [guard]
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows deps
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Enable sccache
        shell: bash
        run: echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: sccache stats (pre-build)
        run: sccache --zero-stats || true

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="${RELEASE_VERSION%%-*}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "project_version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaging pp-browser ${RELEASE_VERSION} for Windows"

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_COMPILER_CACHE=ON \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DPP_BROWSER_VERSION="${{ steps.version.outputs.project_version }}" \
            -DPP_BROWSER_RELEASE_VERSION="${{ steps.version.outputs.release_version }}" \
            -DPP_BROWSER_PACKAGED_BUILD=ON

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package
        shell: bash
        run: |
          cd build
          cpack -G NSIS
          exe="$(find . -maxdepth 2 -name '*.exe' -print -quit)"
          if [ -z "$exe" ]; then
            echo "::error::No .exe produced under build/"
            find . -name '*.exe' | head -50
            exit 1
          fi
          echo "Packaged ${exe}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: build/*.exe
          if-no-files-found: error

      - name: sccache stats (post-build)
        run: sccache --show-stats || true

  android:
    needs: [guard]
    runs-on: ubuntu-24.04
    env:
      # Set before setup-java / Gradle daemon so native builds inherit ccache config.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_COMPILERCHECK: string:android-ndk-r27.0.12077973
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
      # Keep well under GitHub-hosted runner free disk (~14GB before cleanup).
      CCACHE_MAXSIZE: 2G
      ORG_GRADLE_PROJECT_ppBrowserCompilerCache: ON
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.0.12077973'

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Ensure Android cache directories exist
        run: |
          mkdir -p "$CCACHE_DIR"
          mkdir -p "$HOME/.gradle/caches"
          mkdir -p "$HOME/.gradle/wrapper"
          mkdir -p "$GITHUB_WORKSPACE/android/.gradle"
          chmod -R u+rwX "$CCACHE_DIR" "$HOME/.gradle" "$GITHUB_WORKSPACE/android/.gradle"

      - name: Restore Android Gradle cache
        uses: actions/cache@v4
        with:
          # Intentionally omit android/build and android/app/.cxx — large intermediates
          # that often exhaust runner disk when restored.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-android-gradle-v3-${{ hashFiles('android/build.gradle*', 'android/settings.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-v3-

      - name: Restore Android ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-ccache-v4-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'android/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-android-ccache-v4-

      - name: Disk usage (pre-build)
        run: |
          df -h
          du -sh .cache/ccache ~/.gradle android/.gradle 2>/dev/null || true

      - name: ccache stats (pre-build)
        run: |
          echo "=== restored ccache (before zero-stats) ==="
          ccache --show-stats || true
          ccache --print-config 2>/dev/null || true
          # Cap any oversized restored cache from older CCACHE_MAXSIZE=10G runs.
          ccache --max-size="${CCACHE_MAXSIZE}" || true
          ccache --zero-stats || true

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="${RELEASE_VERSION%%-*}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "project_version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaging pp-browser ${RELEASE_VERSION} for Android"

      - name: Build release APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
          PP_BROWSER_VERSION: ${{ steps.version.outputs.project_version }}
          PP_BROWSER_RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: ./scripts/android_build.sh apk-release

      - name: Disk usage (post-build)
        if: always()
        run: |
          df -h
          du -sh .cache/ccache ~/.gradle android/.gradle android/build android/app/.cxx android/app/build 2>/dev/null || true

      - name: ccache stats (post-build)
        if: always()
        run: ccache --show-stats || true

      - name: Package APK
        shell: bash
        run: |
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::No release APK produced under android/app/build/outputs/apk/release/"
            find android/app/build/outputs/apk -name '*.apk' | head -20
            exit 1
          fi
          mkdir -p dist/android
          cp "$apk" "dist/android/pp-browser-${{ steps.version.outputs.release_version }}-android.apk"
          echo "Packaged dist/android/pp-browser-${{ steps.version.outputs.release_version }}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-release-apk
          path: dist/android/*.apk
          if-no-files-found: error

  release:
    needs: [macos, windows, android]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-installer
          path: dist/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: dist/windows

      - name: Download Android artifact
        uses: actions/download-artifact@v7
        with:
          name: android-release-apk
          path: dist/android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: pp-browser ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/macos/*
            dist/windows/*
            dist/android/*
          body: |
            ## App release

            macOS / Windows / Android installers. Headless **`pp-node`** ships on a separate train — tag `pp-node/v…` and see [RELEASE.md](https://github.com/${{ github.repository }}/blob/main/docs/ops/RELEASE.md).
