name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="${RELEASE_VERSION%%-*}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "project_version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaging pp-browser ${RELEASE_VERSION} for macOS"

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_VERSION="${{ steps.version.outputs.project_version }}" \
            -DPP_BROWSER_RELEASE_VERSION="${{ steps.version.outputs.release_version }}" \
            -DPP_BROWSER_PACKAGED_BUILD=ON

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --prefix install

      - name: Package
        run: cpack --config build/CPackConfig.cmake

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: build/*.dmg

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="${RELEASE_VERSION%%-*}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "project_version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaging pp-browser ${RELEASE_VERSION} for Windows"

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_VERSION="${{ steps.version.outputs.project_version }}" \
            -DPP_BROWSER_RELEASE_VERSION="${{ steps.version.outputs.release_version }}" \
            -DPP_BROWSER_PACKAGED_BUILD=ON

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --prefix install

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package
        run: cpack --config build/CPackConfig.cmake

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/*.exe

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: dist/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: pp-browser ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/macos/*
            dist/windows/*
