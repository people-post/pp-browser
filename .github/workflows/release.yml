name: release

# App releases (release-compatibility DESIGN § Branches and tags, docs/ops/RELEASE.md). pp-node: release-pp-node.yml.
#
# - vX.Y.Z-rc.<n> on release/app-X.Y: a release candidate. Built once, with its final version X.Y.Z: macOS DMG,
#   Windows installer, Android APK and the TestFlight upload (ios-testflight.yml); a GitHub prerelease holds the files.
# - vX.Y.Z on the same commit as a candidate: the release. Nothing is rebuilt: the GitHub release gets that
#   candidate's files (build once, promote the artifact).
# The guard refuses every other tag, and tags whose commit is not on release/app-X.Y.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  INSTALL_PREFIX: ${{ github.workspace }}/install
  # The build names itself in About and its diagnostics (src/foundation/product/GenBuildInfo.cmake reads these).
  PP_BUILD_TAG: ${{ github.ref_name }}
  PP_BUILD_COMMIT: ${{ github.sha }}

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.tag.outputs.kind }}
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
      candidate: ${{ steps.tag.outputs.candidate }}
      testflight_build: ${{ steps.tag.outputs.testflight_build }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release tags only from release/app-X.Y (RC007, RC016)
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          num='(0|[1-9][0-9]*)'
          if [[ ! "$tag" =~ ^v(${num}\.${num}\.${num})(-rc\.([1-9][0-9]*))?$ ]]; then
            echo "::error::${tag} is not an app release tag. Release workflows take vX.Y.Z (a release) and vX.Y.Z-rc.<n> (a release candidate) only; a build to try goes through ios-testflight by hand (tagged internal/<n>)."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          major="${BASH_REMATCH[2]}"
          minor="${BASH_REMATCH[3]}"
          patch="${BASH_REMATCH[4]}"
          rc="${BASH_REMATCH[6]}"
          branch="release/app-${major}.${minor}"
          commit="$(git rev-parse HEAD)"
          if ! git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"; then
            echo "::error::${tag}: there is no branch ${branch}. App release tags go on their release branch; cut it from main first (docs/ops/RELEASE.md)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" "origin/${branch}"; then
            echo "::error::${tag} points at ${commit}, which is not on ${branch}. App release tags are taken only from their release branch (v${major}.${minor}.* from ${branch})."
            exit 1
          fi
          echo "OK: ${commit} is on ${branch}"
          if [[ -n "$rc" ]]; then
            if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
              echo "::error::v${version} is already released; a fix to it is v${major}.${minor}.$(( patch + 1 ))-rc.1."
              exit 1
            fi
            kind="candidate"
            candidate=""
            testflight_build=""
          else
            # Build once: the release takes the files of a candidate on this same commit.
            re="^v${version//./\\.}-rc\\.([1-9][0-9]*)$"
            candidate=""
            best=0
            while read -r t; do
              if [[ "$t" =~ $re ]] && (( BASH_REMATCH[1] > best )); then
                best="${BASH_REMATCH[1]}"
                candidate="$t"
              fi
            done < <(git tag --points-at "$commit")
            if [[ -z "$candidate" ]]; then
              echo "::error::${tag}: no release candidate v${version}-rc.<n> points at ${commit}. A release is never built: tag a candidate, let it build and pass, then tag ${tag} on the same commit."
              exit 1
            fi
            if ! gh release view "$candidate" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null; then
              echo "::error::${tag}: candidate ${candidate} has no GitHub release, so its build did not finish. Fix it and tag a new candidate."
              exit 1
            fi
            # The candidate's TestFlight build (ios-testflight.yml tags it rc-build/<n>).
            testflight_build="$(git tag --points-at "$commit" --list 'rc-build/*' | sed 's#^rc-build/##' | sort -n | tail -1)"
            kind="release"
          fi
          # GitHub's "latest" only for the newest release, not for a fix to an older line.
          newest="$( { git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "v${version}"; } | sort -V | tail -1)"
          latest=false
          if [[ "$newest" == "v${version}" ]]; then
            latest=true
          fi
          {
            echo "kind=${kind}"
            echo "version=${version}"
            echo "commit=${commit}"
            echo "candidate=${candidate}"
            echo "testflight_build=${testflight_build}"
            echo "latest=${latest}"
          } >> "$GITHUB_OUTPUT"
          echo "${tag}: ${kind} of ${version} from ${branch}${candidate:+ (promotes ${candidate})}"
      - name: Require the org relays' ids and certificates (SIGNED_FORMATS § 3.5)
        if: steps.tag.outputs.kind == 'candidate'
        shell: bash
        env:
          PP_API_URL_STAGING: ${{ secrets.PP_API_URL_STAGING }}
          PP_API_URL_DEV: ${{ secrets.PP_API_URL_DEV }}
          PP_RELAY_ID_PROD: ${{ vars.PP_RELAY_ID_PROD || secrets.PP_RELAY_ID_PROD }}
          PP_RELAY_ID_STAGING: ${{ vars.PP_RELAY_ID_STAGING || secrets.PP_RELAY_ID_STAGING }}
          PP_RELAY_ID_DEV: ${{ vars.PP_RELAY_ID_DEV || secrets.PP_RELAY_ID_DEV }}
        run: ./scripts/check/check_relay_ids.sh release

  macos:
    needs: [guard]
    if: needs.guard.outputs.kind == 'candidate'
    # The self-hosted Mac (CI_MAC_RELEASE_LABELS, as TestFlight; hosted macos-15 when unset). Tag pushes only.
    runs-on: ${{ fromJSON(vars.CI_MAC_RELEASE_LABELS || '"macos-15"') }}
    env:
      CCACHE_COMPRESSLEVEL: 5

    steps:
      - uses: actions/checkout@v7

      - name: Install macOS deps
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi

      - name: Ensure ccache directory exists
        run: |
          mkdir -p .cache/ccache
          echo "CCACHE_DIR=${{ github.workspace }}/.cache/ccache" >> "$GITHUB_ENV"

      - name: Runner image (ccache key)
        shell: bash
        # ccache misses everything after a compiler change, so a new runner image starts its own cache
        # (falling back to the newest one); a self-hosted runner has no image version.
        run: echo "PP_RUNNER_IMAGE=${ImageOS:-self-hosted}-${ImageVersion:-none}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macOS-ccache-v2-${{ env.PP_RUNNER_IMAGE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/release.yml') }}
          restore-keys: |
            macOS-ccache-v2-${{ env.PP_RUNNER_IMAGE }}-
            macOS-ccache-v2-

      - name: ccache stats (pre-build)
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: Parse version from tag
        id: version
        shell: bash
        env:
          GUARD_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          # A candidate is built with its final version X.Y.Z, so the release can ship these same files (build once;
          # the tag itself names the candidate). PB-009: only a version goes on into the build.
          RELEASE_VERSION="${GUARD_VERSION}"
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::guard version ${RELEASE_VERSION} is not X.Y.Z"
            exit 1
          fi
          PROJECT_VERSION="${RELEASE_VERSION}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "project_version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "PP_RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "PP_PROJECT_VERSION=${PROJECT_VERSION}" >> "$GITHUB_ENV"
          echo "Packaging pp-browser ${RELEASE_VERSION} for macOS"

      - name: Configure
        shell: bash
        env:
          PP_API_URL_PROD: ${{ secrets.PP_API_URL_PROD }}
          PP_API_URL_STAGING: ${{ secrets.PP_API_URL_STAGING }}
          PP_API_URL_DEV: ${{ secrets.PP_API_URL_DEV }}
          PP_RELAY_ID_PROD: ${{ vars.PP_RELAY_ID_PROD || secrets.PP_RELAY_ID_PROD }}
          PP_RELAY_ID_STAGING: ${{ vars.PP_RELAY_ID_STAGING || secrets.PP_RELAY_ID_STAGING }}
          PP_RELAY_ID_DEV: ${{ vars.PP_RELAY_ID_DEV || secrets.PP_RELAY_ID_DEV }}
          PP_RELAY_CONTENT_SHA256: ${{ vars.PP_RELAY_CONTENT_SHA256 }}
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_COMPILER_CACHE=ON \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DPP_BROWSER_VERSION="${PP_PROJECT_VERSION}" \
            -DPP_BROWSER_RELEASE_VERSION="${PP_RELEASE_VERSION}" \
            -DPP_BROWSER_PACKAGED_BUILD=ON \
            -DPP_API_URL_PROD="${PP_API_URL_PROD}" \
            -DPP_API_URL_STAGING="${PP_API_URL_STAGING}" \
            -DPP_API_URL_DEV="${PP_API_URL_DEV}" \
            -DPP_RELAY_ID_PROD="${PP_RELAY_ID_PROD:-pending}" \
            -DPP_RELAY_ID_STAGING="${PP_RELAY_ID_STAGING:-pending}" \
            -DPP_RELAY_ID_DEV="${PP_RELAY_ID_DEV:-pending}" \
            -DPP_RELAY_CONTENT_SHA256="${PP_RELAY_CONTENT_SHA256:-OFF}"

      - name: Build
        run: cmake --build build --config Release -j "$(cmake -P cmake/HostCores.cmake)"

      - name: Test
        run: ctest --test-dir build -C Release -j --output-on-failure

      - name: Install
        run: cmake --install build

      - name: Check no Homebrew dylib linkage
        run: ./scripts/platform/macos_check_bundled_linkage.sh "${INSTALL_PREFIX}/PP.app"

      - name: Sign macOS app
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/platform/macos_sign_and_notarize.sh sign-app "${INSTALL_PREFIX}/PP.app"

      - name: Package
        shell: bash
        run: |
          detach_stale_volume() {
            for mount in /Volumes/pp-browser /Volumes/pp-browser-*; do
              if [ -d "$mount" ]; then
                echo "Detaching stale mount: $mount"
                hdiutil detach "$mount" -force || true
              fi
            done
          }

          detach_stale_volume

          attempts=0
          max_attempts=3
          until (cd build && cpack -G DragNDrop); do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "::error::cpack DragNDrop failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "::warning::cpack DragNDrop attempt ${attempts} failed; retrying in 5s"
            detach_stale_volume
            rm -f build/*.dmg
            sleep 5
          done

          dmg="$(find build -maxdepth 2 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg produced under build/"
            find build -name '*.dmg' -o -name '_CPack_Packages' -type d | head -50
            exit 1
          fi
          echo "Packaged ${dmg}"
          echo "dmg_path=${dmg}" >> "$GITHUB_ENV"

      - name: Verify signed app inside DMG
        run: |
          set -euo pipefail
          mnt="$(mktemp -d "${RUNNER_TEMP}/pp-dmg.XXXXXX")"
          cleanup() { hdiutil detach "$mnt" -force >/dev/null 2>&1 || true; rm -rf "$mnt"; }
          trap cleanup EXIT
          hdiutil attach "${dmg_path}" -readonly -nobrowse -mountpoint "$mnt"
          app="$(find "$mnt" -maxdepth 2 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::No .app in DMG"
            ls -la "$mnt"
            exit 1
          fi
          echo "Verifying ${app}"
          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign -dv --verbose=2 "$app" 2>&1 || true)"
          echo "$details"
          echo "$details" | grep -q "Authority=Developer ID Application" \
            || { echo "::error::DMG app is not Developer ID–signed (cpack may have re-installed unsigned)"; exit 1; }

      - name: Notarize and staple DMG
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_P8_BASE64: ${{ secrets.APPLE_NOTARY_P8_BASE64 }}
        run: |
          ./scripts/platform/macos_sign_and_notarize.sh notarize "${dmg_path}"
          ./scripts/platform/macos_sign_and_notarize.sh staple "${dmg_path}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: build/*.dmg
          if-no-files-found: error

      - name: ccache stats (post-build)
        run: ccache --show-stats || true

  windows:
    needs: [guard]
    if: needs.guard.outputs.kind == 'candidate'
    runs-on: windows-2022
    env:
      CCACHE_COMPRESSLEVEL: 5

    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows deps
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install ccache --no-progress -y

      - name: Ensure ccache directory exists
        shell: bash
        run: |
          mkdir -p .cache/ccache
          echo "CCACHE_DIR=${{ github.workspace }}/.cache/ccache" >> "$GITHUB_ENV"

      - name: Runner image (ccache key)
        shell: bash
        # ccache misses everything after a compiler change, so a new runner image starts its own cache
        # (falling back to the newest one); a self-hosted runner has no image version.
        run: echo "PP_RUNNER_IMAGE=${ImageOS:-self-hosted}-${ImageVersion:-none}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: Windows-ccache-v2-${{ env.PP_RUNNER_IMAGE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/release.yml') }}
          restore-keys: |
            Windows-ccache-v2-${{ env.PP_RUNNER_IMAGE }}-
            Windows-ccache-v2-

      - name: ccache stats (pre-build)
        shell: bash
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: Parse version from tag
        id: version
        shell: bash
        env:
          GUARD_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          # A candidate is built with its final version X.Y.Z, so the release can ship these same files (build once;
          # the tag itself names the candidate). PB-009: only a version goes on into the build.
          RELEASE_VERSION="${GUARD_VERSION}"
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::guard version ${RELEASE_VERSION} is not X.Y.Z"
            exit 1
          fi
          PROJECT_VERSION="${RELEASE_VERSION}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "project_version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "PP_RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "PP_PROJECT_VERSION=${PROJECT_VERSION}" >> "$GITHUB_ENV"
          echo "Packaging pp-browser ${RELEASE_VERSION} for Windows"

      - name: Configure
        shell: bash
        env:
          PP_API_URL_PROD: ${{ secrets.PP_API_URL_PROD }}
          PP_API_URL_STAGING: ${{ secrets.PP_API_URL_STAGING }}
          PP_API_URL_DEV: ${{ secrets.PP_API_URL_DEV }}
          PP_RELAY_ID_PROD: ${{ vars.PP_RELAY_ID_PROD || secrets.PP_RELAY_ID_PROD }}
          PP_RELAY_ID_STAGING: ${{ vars.PP_RELAY_ID_STAGING || secrets.PP_RELAY_ID_STAGING }}
          PP_RELAY_ID_DEV: ${{ vars.PP_RELAY_ID_DEV || secrets.PP_RELAY_ID_DEV }}
          PP_RELAY_CONTENT_SHA256: ${{ vars.PP_RELAY_CONTENT_SHA256 }}
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_COMPILER_CACHE=ON \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DPP_BROWSER_VERSION="${PP_PROJECT_VERSION}" \
            -DPP_BROWSER_RELEASE_VERSION="${PP_RELEASE_VERSION}" \
            -DPP_BROWSER_PACKAGED_BUILD=ON \
            -DPP_API_URL_PROD="${PP_API_URL_PROD}" \
            -DPP_API_URL_STAGING="${PP_API_URL_STAGING}" \
            -DPP_API_URL_DEV="${PP_API_URL_DEV}" \
            -DPP_RELAY_ID_PROD="${PP_RELAY_ID_PROD:-pending}" \
            -DPP_RELAY_ID_STAGING="${PP_RELAY_ID_STAGING:-pending}" \
            -DPP_RELAY_ID_DEV="${PP_RELAY_ID_DEV:-pending}" \
            -DPP_RELAY_CONTENT_SHA256="${PP_RELAY_CONTENT_SHA256:-OFF}"

      - name: Build
        run: cmake --build build --config Release -j "$(cmake -P cmake/HostCores.cmake)"

      - name: Test
        run: ctest --test-dir build -C Release -j --output-on-failure

      - name: Install
        run: cmake --install build

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package
        shell: bash
        run: |
          cd build
          cpack -G NSIS
          exe="$(find . -maxdepth 2 -name '*.exe' -print -quit)"
          if [ -z "$exe" ]; then
            echo "::error::No .exe produced under build/"
            find . -name '*.exe' | head -50
            exit 1
          fi
          echo "Packaged ${exe}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: build/*.exe
          if-no-files-found: error

      - name: ccache stats (post-build)
        shell: bash
        run: ccache --show-stats || true

  android:
    needs: [guard]
    if: needs.guard.outputs.kind == 'candidate'
    runs-on: ubuntu-24.04
    env:
      # Set before setup-java / Gradle daemon so native builds inherit ccache config.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_COMPILERCHECK: string:android-ndk-r28.0.13004108
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
      # Keep well under GitHub-hosted runner free disk (~14GB before cleanup).
      CCACHE_MAXSIZE: 2G
      ORG_GRADLE_PROJECT_ppBrowserCompilerCache: ON
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;28.0.13004108'

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Ensure Android cache directories exist
        run: |
          mkdir -p "$CCACHE_DIR"
          mkdir -p "$HOME/.gradle/caches"
          mkdir -p "$HOME/.gradle/wrapper"
          mkdir -p "$GITHUB_WORKSPACE/android/.gradle"
          chmod -R u+rwX "$CCACHE_DIR" "$HOME/.gradle" "$GITHUB_WORKSPACE/android/.gradle"

      - name: Restore Android Gradle cache
        uses: actions/cache@v6
        with:
          # Intentionally omit android/build and android/app/.cxx — large intermediates
          # that often exhaust runner disk when restored.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-android-gradle-v3-${{ hashFiles('android/build.gradle*', 'android/settings.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-v3-

      - name: Runner image (ccache key)
        shell: bash
        # ccache misses everything after a compiler change, so a new runner image starts its own cache
        # (falling back to the newest one); a self-hosted runner has no image version.
        run: echo "PP_RUNNER_IMAGE=${ImageOS:-self-hosted}-${ImageVersion:-none}" >> "$GITHUB_ENV"

      - name: Restore Android ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-ccache-v5-${{ env.PP_RUNNER_IMAGE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'android/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-android-ccache-v5-${{ env.PP_RUNNER_IMAGE }}-
            ${{ runner.os }}-android-ccache-v5-

      - name: Disk usage (pre-build)
        run: |
          df -h
          du -sh .cache/ccache ~/.gradle android/.gradle 2>/dev/null || true

      - name: ccache stats (pre-build)
        run: |
          echo "=== restored ccache (before zero-stats) ==="
          ccache --show-stats || true
          ccache --print-config 2>/dev/null || true
          # Cap any oversized restored cache from older CCACHE_MAXSIZE=10G runs.
          ccache --max-size="${CCACHE_MAXSIZE}" || true
          ccache --zero-stats || true

      - name: Parse version from tag
        id: version
        shell: bash
        env:
          GUARD_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          # A candidate is built with its final version X.Y.Z, so the release can ship these same files (build once;
          # the tag itself names the candidate). PB-009: only a version goes on into the build.
          RELEASE_VERSION="${GUARD_VERSION}"
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::guard version ${RELEASE_VERSION} is not X.Y.Z"
            exit 1
          fi
          PROJECT_VERSION="${RELEASE_VERSION}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "project_version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "PP_RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "PP_PROJECT_VERSION=${PROJECT_VERSION}" >> "$GITHUB_ENV"
          echo "Packaging pp-browser ${RELEASE_VERSION} for Android"

      - name: Build release APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
          PP_BROWSER_VERSION: ${{ steps.version.outputs.project_version }}
          PP_BROWSER_RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          PP_API_URL_PROD: ${{ secrets.PP_API_URL_PROD }}
          PP_API_URL_STAGING: ${{ secrets.PP_API_URL_STAGING }}
          PP_API_URL_DEV: ${{ secrets.PP_API_URL_DEV }}
          PP_RELAY_ID_PROD: ${{ vars.PP_RELAY_ID_PROD || secrets.PP_RELAY_ID_PROD }}
          PP_RELAY_ID_STAGING: ${{ vars.PP_RELAY_ID_STAGING || secrets.PP_RELAY_ID_STAGING }}
          PP_RELAY_ID_DEV: ${{ vars.PP_RELAY_ID_DEV || secrets.PP_RELAY_ID_DEV }}
          PP_RELAY_CONTENT_SHA256: ${{ vars.PP_RELAY_CONTENT_SHA256 }}
        run: ./scripts/platform/android_build.sh apk-release

      - name: Disk usage (post-build)
        if: always()
        run: |
          df -h
          du -sh .cache/ccache ~/.gradle android/.gradle android/build android/app/.cxx android/app/build 2>/dev/null || true

      - name: ccache stats (post-build)
        if: always()
        run: ccache --show-stats || true

      - name: Package APK
        shell: bash
        run: |
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::No release APK produced under android/app/build/outputs/apk/release/"
            find android/app/build/outputs/apk -name '*.apk' | head -20
            exit 1
          fi
          mkdir -p dist/android
          cp "$apk" "dist/android/pp-browser-${PP_RELEASE_VERSION}-android.apk"
          echo "Packaged dist/android/pp-browser-${PP_RELEASE_VERSION}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: dist/android/*.apk
          if-no-files-found: error

  # The candidate's TestFlight upload, same workflow as a dev build (tags rc-build/<build number> after it).
  ios:
    needs: [guard]
    if: needs.guard.outputs.kind == 'candidate'
    uses: ./.github/workflows/ios-testflight.yml
    permissions:
      contents: write
    with:
      candidate_tag: ${{ github.ref_name }}
    secrets: inherit

  # A candidate's GitHub prerelease, made only when every platform built and TestFlight took the upload: a release
  # (vX.Y.Z) promotes only a candidate that has one.
  release:
    needs: [guard, macos, windows, android, ios]
    if: needs.guard.outputs.kind == 'candidate'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-installer
          path: dist/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/windows

      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: android-release-apk
          path: dist/android

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          name: pp-browser ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            dist/macos/*
            dist/windows/*
            dist/android/*
          body: |
            ## App release candidate

            Release candidate of **${{ needs.guard.outputs.version }}**, built with that version: macOS / Windows / Android installers, and iOS TestFlight build **${{ needs.guard.outputs.version }} (${{ needs.ios.outputs.build_number }})** (tag `rc-build/${{ needs.ios.outputs.build_number }}`). Tagging `v${{ needs.guard.outputs.version }}` on this commit releases these same files without a rebuild. Headless **`pp-node`** ships on a separate train — see [RELEASE.md](https://github.com/${{ github.repository }}/blob/main/docs/ops/RELEASE.md).

  # vX.Y.Z: no build. The release gets the candidate's files, byte for byte (DESIGN § Builds, tags and deploys).
  # TODO (docs/ops/RELEASE.md § Coming): the store promotion workflow (App Store Connect / Play APIs).
  promote:
    needs: [guard]
    if: needs.guard.outputs.kind == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Release the candidate's files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.guard.outputs.version }}
          COMMIT: ${{ needs.guard.outputs.commit }}
          CANDIDATE: ${{ needs.guard.outputs.candidate }}
          TESTFLIGHT_BUILD: ${{ needs.guard.outputs.testflight_build }}
          LATEST: ${{ needs.guard.outputs.latest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$CANDIDATE" --repo "$GITHUB_REPOSITORY" --dir dist
          shopt -s nullglob
          files=(dist/*)
          if (( ${#files[@]} == 0 )); then
            echo "::error::candidate ${CANDIDATE}'s GitHub release has no files"
            exit 1
          fi
          {
            echo "## App release"
            echo ""
            echo "**${VERSION}**, promoted from release candidate **${CANDIDATE}** (commit \`${COMMIT}\`): these are that candidate's files, not a rebuild."
            echo ""
            if [[ -n "$TESTFLIGHT_BUILD" ]]; then
              echo "iOS: TestFlight build ${VERSION} (${TESTFLIGHT_BUILD}), tag \`rc-build/${TESTFLIGHT_BUILD}\`. Until the store promotion workflow lands, it is sent to external testers and App Store review by hand in App Store Connect."
              echo ""
            fi
            echo "| File | SHA-256 |"
            echo "|------|---------|"
            for f in "${files[@]}"; do
              echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            echo ""
            echo "Headless **\`pp-node\`** ships on a separate train — see [RELEASE.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/ops/RELEASE.md)."
          } > notes.md
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "pp-browser ${TAG}" --notes-file notes.md --generate-notes --latest="${LATEST}"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
