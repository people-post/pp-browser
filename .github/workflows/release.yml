name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  INSTALL_PREFIX: ${{ github.workspace }}/install

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install macOS deps
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi

      - name: Ensure ccache directory exists
        run: |
          mkdir -p "$HOME/.cache/ccache"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macOS-ccache-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/release.yml') }}
          restore-keys: |
            macOS-ccache-v1-

      - name: ccache stats (pre-build)
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="${RELEASE_VERSION%%-*}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "project_version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaging pp-browser ${RELEASE_VERSION} for macOS"

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DPP_BROWSER_VERSION="${{ steps.version.outputs.project_version }}" \
            -DPP_BROWSER_RELEASE_VERSION="${{ steps.version.outputs.release_version }}" \
            -DPP_BROWSER_PACKAGED_BUILD=ON

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build

      - name: Package
        shell: bash
        run: |
          detach_stale_volume() {
            for mount in /Volumes/pp-browser /Volumes/pp-browser-*; do
              if [ -d "$mount" ]; then
                echo "Detaching stale mount: $mount"
                hdiutil detach "$mount" -force || true
              fi
            done
          }

          detach_stale_volume

          attempts=0
          max_attempts=3
          until (cd build && cpack -G DragNDrop); do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "::error::cpack DragNDrop failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "::warning::cpack DragNDrop attempt ${attempts} failed; retrying in 5s"
            detach_stale_volume
            rm -f build/*.dmg
            sleep 5
          done

          dmg="$(find build -maxdepth 2 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg produced under build/"
            find build -name '*.dmg' -o -name '_CPack_Packages' -type d | head -50
            exit 1
          fi
          echo "Packaged ${dmg}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-installer
          path: build/*.dmg
          if-no-files-found: error

      - name: ccache stats (post-build)
        run: ccache --show-stats || true

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="${RELEASE_VERSION%%-*}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "project_version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaging pp-browser ${RELEASE_VERSION} for Windows"

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DPP_BROWSER_VERSION="${{ steps.version.outputs.project_version }}" \
            -DPP_BROWSER_RELEASE_VERSION="${{ steps.version.outputs.release_version }}" \
            -DPP_BROWSER_PACKAGED_BUILD=ON

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package
        shell: bash
        run: |
          cd build
          cpack -G NSIS
          exe="$(find . -maxdepth 2 -name '*.exe' -print -quit)"
          if [ -z "$exe" ]; then
            echo "::error::No .exe produced under build/"
            find . -name '*.exe' | head -50
            exit 1
          fi
          echo "Packaged ${exe}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: build/*.exe
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-installer
          path: dist/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: dist/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: pp-browser ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/macos/*
            dist/windows/*
