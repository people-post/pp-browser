name: lab-run

# One app-lab run on a CodeBuild-hosted runner (pp-runners-infra: project pp-browser, privileged, LARGE), called by
# nightly-lab.yml (every suite, nightly) and lab-smoke.yml (the smoke set, every merge to main) —
# docs/ops/TEST_STRATEGY.md § Nightly lab, § Lab smoke. The runner is ephemeral: it builds pp-app-probe and pp-node
# (ccache from the Actions cache), runs the suites and a hosted job reports. The relay is pp-relay-apis's local stack,
# from a checkout of that repository (PP_LAB_RELAY_APIS_REF, default main: what prod runs).
#
# Idle — a notice and nothing started — until the secret PP_LAB_RELAY_APIS_DEPLOY_KEY (a read-only
# deploy key of people-post/pp-relay-apis, which is private) is set. Callers pass `secrets: inherit` and grant contents: read and
# issues: write.

on:
  workflow_call:
    inputs:
      name:
        description: 'What the run is called in its summary and notices'
        type: string
        required: true
      artifact:
        description: 'The artifact that keeps the summaries and what failed'
        type: string
        required: true
      suites:
        description: 'Suites to run (space-separated)'
        type: string
        default: 'app app-nat'
      only:
        description: 'Scenarios by name (space-separated)'
        type: string
        default: ''
      tags:
        description: 'Scenarios with any of these tags (a,b)'
        type: string
        default: ''
      changed:
        description: 'Scenarios a change touches (pp_app_lab.py --changed: a range, a revision or paths)'
        type: string
        default: ''
      issues:
        description: 'Keep one issue per failing scenario (nightly_lab_report.py); otherwise the summary only'
        type: boolean
        default: false
      suite_timeout_minutes:
        type: number
        default: 100
      job_timeout_minutes:
        type: number
        default: 220

jobs:
  gate:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      # The secrets context is unavailable in job-level `if`, so the whole gate is a step.
      - name: Check the lab is set up
        id: gate
        env:
          RUN_NAME: ${{ inputs.name }}
          RELAY_APIS_KEY: ${{ secrets.PP_LAB_RELAY_APIS_DEPLOY_KEY }}
        run: |
          if [ -z "$RELAY_APIS_KEY" ]; then
            msg="$RUN_NAME skipped: the lab is not set up (no secret PP_LAB_RELAY_APIS_DEPLOY_KEY; docs/ops/TEST_STRATEGY.md § Nightly lab)."
            echo "::notice title=$RUN_NAME idle::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  lab:
    name: lab run
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: codebuild-pp-browser-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    env:
      # Outside the workspace: checkout cleans the workspace.
      PP_LOCAL_BUILD_DIR: ${{ github.workspace }}/../pp-lab/build
      CCACHE_DIR: ${{ github.workspace }}/../pp-lab/ccache
      # The lab's relays build from it (packaging/pp-node/docker-compose.app-lab.yml).
      PP_RELAY_APIS_ROOT: ${{ github.workspace }}/pp-relay-apis
    steps:
      - uses: actions/checkout@v7
        with:
          # --changed diffs against other commits: then the whole history (0), else the commit alone.
          fetch-depth: ${{ inputs.changed == '' && 1 || 0 }}

      - uses: actions/checkout@v7
        with:
          repository: people-post/pp-relay-apis
          ref: ${{ vars.PP_LAB_RELAY_APIS_REF || 'main' }}
          ssh-key: ${{ secrets.PP_LAB_RELAY_APIS_DEPLOY_KEY }}
          path: pp-relay-apis
          persist-credentials: false

      - name: Record the relay commit
        run: git -C "$PP_RELAY_APIS_ROOT" rev-parse HEAD | tee "$RUNNER_TEMP/relay-commit.txt"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxfixes-dev libxrender-dev libxss-dev libgl-dev libdbus-1-dev libssl-dev libpulse-dev libasound2-dev
          # The runner image has no CMake (the project needs 3.24+).
          python3 -m pip install --user cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ccache path experiment
        run: |
          set +e
          tgts="ui_widgets libcurl_static pp_foundation_error"
          run_build() { # label ccache-dir [VAR=value ...]
            label=$1; cdir=$2; shift 2
            root=/tmp/exp/$label; rm -rf "$root"; mkdir -p "$root/src" "$root/build"
            tar --exclude=.git --exclude=pp-relay-apis -cf - . | tar -xf - -C "$root/src"
            env CCACHE_DIR="$cdir" "$@" bash -c '
              ccache --zero-stats >/dev/null
              cmake -S "$0/src" -B "$0/build" -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPP_BROWSER_COMPILER_CACHE=ON >/dev/null 2>&1
              t0=$(date +%s)
              cmake --build "$0/build" --target '"$tgts"' -j"$(nproc)" >/dev/null 2>&1
              echo "RESULT '"$label"' build_seconds=$(( $(date +%s) - t0 ))"
              ccache --show-stats 2>&1 | grep -i "hits\|misses\|cacheable" | sed "s/^/RESULT '"$label"'   /"
            ' "$root"
          }
          mkdir -p /tmp/ccA /tmp/ccB
          run_build a1 /tmp/ccA
          run_build a2 /tmp/ccA
          run_build b1 /tmp/ccB CCACHE_BASEDIR=/tmp/exp CCACHE_NOHASHDIR=true
          run_build b2 /tmp/ccB CCACHE_BASEDIR=/tmp/exp CCACHE_NOHASHDIR=true

      - name: Restore ccache
        if: false
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: lab-ccache-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake') }}-${{ github.run_id }}
          restore-keys: |
            lab-ccache-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake') }}-
            lab-ccache-v1-

      - name: Build the probe and pp-node
        if: false
        run: |
          mkdir -p "$PP_LOCAL_BUILD_DIR" "$CCACHE_DIR"
          # Debug: only a Debug desktop build reads PP_BROWSER_CA_BUNDLE, the lab CA its TLS relays need
          # (docs/ops/TEST_STRATEGY.md § Two relays); a Release probe fails every scenario on them. A build dir
          # left in another type is configured again.
          if ! grep -qx 'CMAKE_BUILD_TYPE:STRING=Debug' "$PP_LOCAL_BUILD_DIR/CMakeCache.txt" 2>/dev/null; then
            cmake -S . -B "$PP_LOCAL_BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPP_BROWSER_COMPILER_CACHE=ON
          fi
          cmake --build "$PP_LOCAL_BUILD_DIR" --target pp-app-probe pp-node pp-node-load -j "$(nproc)"

      - name: Run the suites
        if: false
        env:
          LAB_SUITES: ${{ inputs.suites }}
          LAB_ONLY: ${{ inputs.only }}
          LAB_TAGS: ${{ inputs.tags }}
          LAB_CHANGED: ${{ inputs.changed }}
          SUITE_TIMEOUT: ${{ inputs.suite_timeout_minutes }}
        run: |
          mkdir -p "$RUNNER_TEMP/lab"
          select=()
          for name in $LAB_ONLY; do select+=(--only "$name"); done
          if [ -n "$LAB_TAGS" ]; then select+=(--tags "$LAB_TAGS"); fi
          if [ -n "$LAB_CHANGED" ]; then select+=(--changed "$LAB_CHANGED"); fi
          for suite in $LAB_SUITES; do
            echo "::group::--suite $suite ${select[*]}"
            PP_APP_LAB_ARGS="--retry-failed --summary $RUNNER_TEMP/lab/$suite.json" \
              timeout "${SUITE_TIMEOUT}m" scripts/test/pp_local_test.sh run --suite "$suite" "${select[@]}" 2>&1 \
              | tee "$RUNNER_TEMP/lab/$suite.log" || true
            echo "::endgroup::"
          done
          # What failed keeps its profiles and logs: gather them for the artifact.
          python3 - "$RUNNER_TEMP/lab" <<'EOF'
          import glob, json, os, shutil, sys
          out = sys.argv[1]
          for path in glob.glob(os.path.join(out, "*.json")):
              suite = os.path.basename(path)[:-5]
              for r in json.load(open(path))["results"]:
                  for run in (r, r.get("retry") or {}):
                      if run.get("kept") and os.path.isdir(run["kept"]):
                          dest = os.path.join(out, "kept", suite, r["name"], os.path.basename(run["kept"]))
                          shutil.copytree(run["kept"], dest, dirs_exist_ok=True)
                          shutil.rmtree(run["kept"], ignore_errors=True)
          EOF
          cp "$RUNNER_TEMP/relay-commit.txt" "$RUNNER_TEMP/lab/"

      # Nightly only: a smoke run per merge would fill the repository's cache quota.
      - name: Save ccache
        if: always() && github.event_name == 'schedule'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/lab
          retention-days: 14

      - name: Tidy the lab
        if: always()
        run: docker compose -p pp-app-lab down --remove-orphans || true

  report:
    needs: [gate, lab]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.enabled == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true # the lab job may have died before uploading
        with:
          name: ${{ inputs.artifact }}
          path: lab
      - name: Summary (and issues)
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_SUITES: ${{ inputs.suites }}
          RUN_NAME: ${{ inputs.name }}
          ISSUES: ${{ inputs.issues }}
        run: |
          args=()
          for suite in $LAB_SUITES; do args+=(--summary "$suite=lab/$suite.json"); done
          if [ "$ISSUES" != true ]; then args+=(--no-issues); fi
          python3 scripts/test/nightly_lab_report.py "${args[@]}" --name "$RUN_NAME" --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
