name: ios-testflight

# TestFlight upload; uses the same scripts as local: scripts/platform/ios_build.sh ipa + upload-ipa. Verify CI stays
# in build.yml. Two ways in (release-compatibility DESIGN § App builds, docs/ops/RELEASE.md):
#
# - By hand (Actions → ios-testflight → Run workflow, any branch or tag): a dev build for internal testers, never
#   promoted. After the upload succeeds the built commit is tagged internal/<build number>.
# - From release.yml (workflow_call) for a release candidate tag vX.Y.Z-rc.<n> on release/app-X.Y: built with its
#   final version X.Y.Z (only the build number differs between candidates). After the upload succeeds the commit is
#   tagged rc-build/<build number>.
#
# Build numbers are one counter across both: the next after the highest internal/<n> or rc-build/<n> tag (and after
# 143, the last number uploaded before builds were tagged: run 43 + 100). Requires iOS signing + ASC secrets
# (docs/ops/IOS_BUILD.md § GitHub Actions / TestFlight).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'CFBundleShortVersionString (empty → PP_BROWSER_VERSION from CMakeLists.txt)'
        required: false
        default: ''
      build_number:
        description: 'CFBundleVersion (empty → next after the highest internal/<n> or rc-build/<n> tag; must not be taken)'
        required: false
        default: ''
  workflow_call:
    inputs:
      candidate_tag:
        description: 'Release candidate tag vX.Y.Z-rc.<n> (release.yml has checked it is on release/app-X.Y)'
        required: true
        type: string
    outputs:
      build_number:
        description: 'CFBundleVersion the candidate was uploaded with'
        value: ${{ jobs.testflight.outputs.build }}

# One upload at a time, by hand or from release.yml (a called workflow keeps its own group), and the whole run: the
# tag job must create internal/<n> or rc-build/<n> before the next run picks its build number. Only one run waits:
# a newer one cancels the one waiting, so a candidate's upload can need a re-run.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: ${{ fromJSON(vars.CI_MAC_RELEASE_LABELS || '"macos-15"') }}
    timeout-minutes: 120
    outputs:
      build: ${{ steps.ver.outputs.build }}
      marketing: ${{ steps.ver.outputs.marketing }}
      commit: ${{ steps.ver.outputs.commit }}
      tag: ${{ steps.ver.outputs.tag }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESSLEVEL: 5
      IOS_EXPORT_METHOD: app-store
      # Public App ID — same as packaging/ios/Info.plist / cmake/IosBundle.cmake
      IOS_BUNDLE_IDENTIFIER: dev.pp-browser.ios
      IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      IOS_DISTRIBUTION_SIGNING_IDENTITY: ${{ secrets.IOS_DISTRIBUTION_SIGNING_IDENTITY }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
      IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
      IOS_ASC_P8_BASE64: ${{ secrets.IOS_ASC_P8_BASE64 }}
      IOS_EXPORT_COMPLIANCE_CODE: ${{ secrets.IOS_EXPORT_COMPLIANCE_CODE }}

    steps:
      - uses: actions/checkout@v7

      - name: Require signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            IOS_DEVELOPMENT_TEAM \
            IOS_DISTRIBUTION_SIGNING_IDENTITY \
            IOS_CERTIFICATE_BASE64 \
            IOS_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 \
            IOS_ASC_KEY_ID \
            IOS_ASC_ISSUER_ID \
            IOS_ASC_P8_BASE64
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Configure iOS TestFlight secrets — see docs/ops/IOS_BUILD.md"
            exit 1
          fi

      - name: Select Xcode 26+ (iOS 26 SDK for ASC)
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode_26.app \
            /Applications/Xcode.app
          do
            if [[ -d "$candidate" ]]; then
              export DEVELOPER_DIR="$candidate/Contents/Developer"
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "::error::No Xcode.app found under /Applications"
            ls /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          echo "Using ${selected}"
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || true)"
          major="${sdk%%.*}"
          if [[ -z "$major" || "$major" -lt 26 ]]; then
            echo "::error::App Store Connect requires the iOS 26 SDK; active SDK is ${sdk:-unknown}"
            echo "::error::Install Xcode 26+ on this runner image (or use a self-hosted Mac)."
            exit 1
          fi
          echo "iphoneos SDK ${sdk}"
          # The icons step (actool) loads Xcode's IDE plugins, which need the first launch done for this Xcode and user;
          # the compile alone does not, so the iOS compile check passing proves nothing here. Fail now, not after the
          # build: on a self-hosted Mac the 2026-11-06/07/18 runs reached actool and stopped there.
          if ! xcodebuild -checkFirstLaunchStatus; then
            echo "::error::Xcode first launch is not done for ${selected} on this runner. On the Mac, as the runner's user: sudo xcode-select -s ${selected}; sudo xcodebuild -license accept; sudo xcodebuild -runFirstLaunch; xcodebuild -downloadPlatform iOS (see docs/ops/IOS_BUILD.md § Runners)"
            exit 1
          fi
          probe="$(mktemp -d)"
          mkdir -p "$probe/probe.xcassets" "$probe/out"
          echo '{"info":{"version":1,"author":"xcode"}}' >"$probe/probe.xcassets/Contents.json"
          if ! xcrun actool "$probe/probe.xcassets" --compile "$probe/out" --platform iphoneos \
              --minimum-deployment-target 16.0 >"$probe/actool.log" 2>&1; then
            cat "$probe/actool.log"
            echo "::error::actool cannot run with ${selected} on this runner (Xcode setup incomplete: see docs/ops/IOS_BUILD.md § Runners)"
            exit 1
          fi
          rm -rf "$probe"

      - name: Install deps
        run: |
          for tool in ccache ninja; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              brew install "$tool"
            fi
          done
          mkdir -p "$CCACHE_DIR"

      - name: Runner image (ccache key)
        shell: bash
        # ccache misses everything after a compiler change, so a new runner image starts its own cache
        # (falling back to the newest one); a self-hosted runner has no image version.
        run: echo "PP_RUNNER_IMAGE=${ImageOS:-self-hosted}-${ImageVersion:-none}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-ios-testflight-ccache-v1-${{ env.PP_RUNNER_IMAGE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/ios-testflight.yml') }}
          restore-keys: |
            ${{ runner.os }}-ios-testflight-ccache-v1-${{ env.PP_RUNNER_IMAGE }}-
            ${{ runner.os }}-ios-testflight-ccache-v1-
            ${{ runner.os }}-ios-ccache-v1-

      - name: Resolve version stamps
        id: ver
        shell: bash
        # PB-009: inputs arrive as env, never pasted into the script text.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          # The last build number CI uploaded before every upload was tagged (run 43 + 100, 2026-11-19).
          build_floor=143
          if [[ -n "${CANDIDATE_TAG}" ]]; then
            # A release candidate: its final version exactly (DESIGN § App builds), never an input.
            if [[ ! "${CANDIDATE_TAG}" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))-rc\.[1-9][0-9]*$ ]]; then
              echo "::error::candidate tag ${CANDIDATE_TAG} is not vX.Y.Z-rc.<n>"
              exit 1
            fi
            marketing="${BASH_REMATCH[1]}"
            release_version="${marketing}"
            tag_prefix="rc-build"
          else
            marketing="${INPUT_VERSION}"
            if [[ -z "$marketing" ]]; then
              marketing="$(sed -n 's/^set(PP_BROWSER_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt | head -1)"
            fi
            if [[ -z "$marketing" ]]; then
              echo "::error::Could not resolve PP_BROWSER_VERSION"
              exit 1
            fi
            # A dev build keeps the tree's PP_BROWSER_RELEASE_VERSION (CMakeLists.txt).
            release_version=""
            tag_prefix="internal"
          fi
          # Every upload's build number is a tag (internal/<n> or rc-build/<n>), so the counter is the highest one.
          highest="$build_floor"
          taken=" "
          while read -r _ ref; do
            n="${ref##*/}"
            [[ "$n" =~ ^[0-9]+$ ]] || continue  # skips the peeled "^{}" lines
            n=$(( 10#$n ))
            taken+="${n} "
            if (( n > highest )); then
              highest="$n"
            fi
          done < <(git ls-remote --tags origin 'refs/tags/internal/*' 'refs/tags/rc-build/*')
          build="${INPUT_BUILD_NUMBER}"
          if [[ -z "$build" ]]; then
            build="$(( highest + 1 ))"
          fi
          if [[ ! "$marketing" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$build" =~ ^[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z and build number digits (got ${marketing} / ${build})"
            exit 1
          fi
          if [[ "$taken" == *" $(( 10#$build )) "* ]]; then
            echo "::error::build number ${build} is taken (tag internal/${build} or rc-build/${build}); leave it empty for the next free one"
            exit 1
          fi
          echo "marketing=${marketing}" >> "$GITHUB_OUTPUT"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=${tag_prefix}/${build}" >> "$GITHUB_OUTPUT"
          echo "CFBundleShortVersionString=${marketing} CFBundleVersion=${build} (tag ${tag_prefix}/${build} after upload)"

      - name: Build IPA and upload to App Store Connect
        env:
          PP_BROWSER_VERSION: ${{ steps.ver.outputs.marketing }}
          PP_BROWSER_BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          # Empty (the tree's default) for a dev build; X.Y.Z for a release candidate.
          PP_BROWSER_RELEASE_VERSION: ${{ steps.ver.outputs.release_version }}
          # About and diagnostics name the build (GenBuildInfo.cmake): the candidate tag, else internal/<build number>.
          PP_BUILD_TAG: ${{ inputs.candidate_tag || steps.ver.outputs.tag }}
          PP_BUILD_COMMIT: ${{ steps.ver.outputs.commit }}
          PP_API_URL_PROD: ${{ secrets.PP_API_URL_PROD }}
          PP_API_URL_STAGING: ${{ secrets.PP_API_URL_STAGING }}
          PP_API_URL_DEV: ${{ secrets.PP_API_URL_DEV }}
          PP_RELAY_ID_PROD: ${{ vars.PP_RELAY_ID_PROD || secrets.PP_RELAY_ID_PROD }}
          PP_RELAY_ID_STAGING: ${{ vars.PP_RELAY_ID_STAGING || secrets.PP_RELAY_ID_STAGING }}
          PP_RELAY_ID_DEV: ${{ vars.PP_RELAY_ID_DEV || secrets.PP_RELAY_ID_DEV }}
          PP_RELAY_CONTENT_SHA256: ${{ vars.PP_RELAY_CONTENT_SHA256 }}
        run: |
          set -euo pipefail
          # TestFlight reaches testers: the org relays' ids and certificates ship with it (SIGNED_FORMATS § 3.5).
          ./scripts/check/check_relay_ids.sh release
          ./scripts/platform/ios_build.sh ipa
          ./scripts/platform/ios_build.sh upload-ipa

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pp-browser-ios-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}
          path: out-ios/dist/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: success()
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          {
            echo "## TestFlight upload"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Ref | \`${GITHUB_SHA}\` (\`${GITHUB_REF_NAME}\`) |"
            echo "| Version | ${{ steps.ver.outputs.marketing }} (${{ steps.ver.outputs.build }}) |"
            if [[ -n "${CANDIDATE_TAG}" ]]; then
              echo "| Build | release candidate \`${CANDIDATE_TAG}\` |"
            else
              echo "| Build | dev build (internal testers only; never promoted) |"
            fi
            echo "| Tag | \`${{ steps.ver.outputs.tag }}\` (next job) |"
            echo ""
            echo "Wait for processing in App Store Connect, answer export compliance if prompted,"
            echo "then enable the build under **TestFlight → Internal Testing**."
          } >> "$GITHUB_STEP_SUMMARY"

  # The upload succeeded: tag the built commit with the build number it used (DESIGN § Builds, tags and deploys), so
  # "TestFlight <n>" maps to one commit. The only job with write access.
  tag:
    needs: [testflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Tag the built commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.testflight.outputs.tag }}
          COMMIT: ${{ needs.testflight.outputs.commit }}
          MARKETING: ${{ needs.testflight.outputs.marketing }}
          BUILD: ${{ needs.testflight.outputs.build }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          what="dev build"
          if [[ -n "${CANDIDATE_TAG}" ]]; then
            what="release candidate ${CANDIDATE_TAG}"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message="TestFlight ${MARKETING} (${BUILD}), ${what}: ${run_url}"
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${TAG}" -f message="${message}" -f object="${COMMIT}" -f type=commit --jq .sha)"
          # Creating a ref that exists fails (422): an existing tag is never moved.
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${object}" >/dev/null; then
            echo "::error::Could not create tag ${TAG} on ${COMMIT} (it exists, or the token cannot write tags). The upload itself succeeded; tag it by hand: git tag -a ${TAG} ${COMMIT} -m '${message}'"
            exit 1
          fi
          echo "Tagged ${COMMIT} ${TAG}"
          echo "Tagged \`${COMMIT}\` **${TAG}**" >> "$GITHUB_STEP_SUMMARY"
