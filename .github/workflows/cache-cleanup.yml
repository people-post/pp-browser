name: cache-cleanup

# Keeps Actions cache usage under the per-repo quota: drop a PR's caches once
# merged/closed, and sweep stale entries left by force-pushes or abandoned branches.

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '0 6 * * 1'
  # Keep only the newest two ccache entries per branch and kind (prune-superseded) after each main build.
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'prune-superseded: only print what it would delete'
        type: boolean
        default: true

permissions:
  actions: write

jobs:
  delete-pr-caches:
    if: github.event_name == 'pull_request_target'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete caches for closed PR
        run: gh cache delete --all --ref "refs/pull/${{ github.event.pull_request.number }}/merge" --succeed-on-no-caches

  prune-stale-caches:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete caches unused for 7+ days
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '7 days ago' +%s)"
          gh cache list --limit 1000 --json id,lastAccessedAt \
            | jq -r --argjson cutoff "$cutoff" \
                '.[] | select((.lastAccessedAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < $cutoff) | .id' \
            | while read -r id; do
                gh cache delete "$id"
              done

  # Only main saves ccache, one entry per commit: keep the newest two per branch and kind (the next main run may still
  # be reading the second). Stage one: only a manual run with dry_run=false deletes; the others print the list.
  prune-superseded:
    if: github.event_name != 'pull_request_target'
    concurrency:
      group: cache-prune-superseded
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DELETE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
    steps:
      - name: Delete ccache entries beyond the newest two per branch and kind
        run: |
          set -euo pipefail
          gh cache list --limit 1000 --json id,key,ref,createdAt \
            | jq -r '
                map(select(.ref | startswith("refs/pull/") | not))
                | map(select(.key | test("-ccache-v[0-9]+-")))
                | map(. + {grp: (.ref + " " + (.key | capture("^(?<g>.*-ccache-v[0-9]+)-").g))})
                | group_by(.grp)[]
                | sort_by(.createdAt) | reverse | .[2:][]
                | "\(.id)\t\(.grp)\t\(.key)"' > superseded.tsv
          echo "Superseded entries (id, group, key):"
          cat superseded.tsv
          if [ "$DELETE" = "true" ]; then
            cut -f1 superseded.tsv | while read -r id; do
              gh cache delete "$id"
            done
          else
            echo "Not deleting (stage one: only a manual run with dry_run=false deletes)."
          fi
