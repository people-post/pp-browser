name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxfixes-dev libxrender-dev libxss-dev libgl-dev libssl-dev xvfb

      - name: Install Windows deps
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi

      - name: Enable sccache
        if: runner.os == 'Windows'
        shell: bash
        run: echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Setup sccache
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Ensure ccache directory exists
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$HOME/.cache/ccache"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-v1-

      - name: ccache stats (pre-build)
        if: runner.os != 'Windows'
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: sccache stats (pre-build)
        if: runner.os == 'Windows'
        run: sccache --zero-stats || true

      - name: Configure
        shell: bash
        run: |
          generator=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            generator=(-G Ninja)
          fi
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_COMPILER_CACHE=ON \
            "${generator[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j 2

      - name: Test
        shell: bash
        env:
          TRACE_DEBUG: "1"
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke run (Linux)
        if: runner.os == 'Linux'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          xvfb_pid=$!
          sleep 1
          set +e
          timeout 3 ./build/pp-browser
          code=$?
          kill "$xvfb_pid" 2>/dev/null || true
          wait "$xvfb_pid" 2>/dev/null || true
          test "$code" -eq 124

      - name: ccache stats (post-build)
        if: always() && runner.os != 'Windows'
        run: ccache --show-stats || true

      - name: sccache stats (post-build)
        if: always() && runner.os == 'Windows'
        run: sccache --show-stats || true

  android:
    runs-on: ubuntu-24.04
    env:
      # Set before setup-java / Gradle daemon so native builds inherit ccache config.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_COMPILERCHECK: string:android-ndk-r27.0.12077973
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
      # Keep well under GitHub-hosted runner free disk (~14GB before cleanup).
      CCACHE_MAXSIZE: 2G
      ORG_GRADLE_PROJECT_ppBrowserCompilerCache: ON
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Ensure Android cache directories exist
        run: |
          mkdir -p "$CCACHE_DIR"
          mkdir -p "$HOME/.gradle/caches"
          mkdir -p "$HOME/.gradle/wrapper"
          mkdir -p "$GITHUB_WORKSPACE/android/.gradle"
          chmod -R u+rwX "$CCACHE_DIR" "$HOME/.gradle" "$GITHUB_WORKSPACE/android/.gradle"

      - name: Restore Android Gradle cache
        uses: actions/cache@v4
        with:
          # Intentionally omit android/build and android/app/.cxx — large intermediates
          # that often exhaust runner disk when restored.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-android-gradle-v3-${{ hashFiles('android/build.gradle*', 'android/settings.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-v3-

      - name: Restore Android ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-ccache-v4-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'android/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-android-ccache-v4-

      - name: Disk usage (pre-build)
        run: |
          df -h
          du -sh .cache/ccache ~/.gradle android/.gradle 2>/dev/null || true

      - name: ccache stats (pre-build)
        run: |
          echo "=== restored ccache (before zero-stats) ==="
          ccache --show-stats || true
          ccache --print-config 2>/dev/null || true
          # Cap any oversized restored cache from older CCACHE_MAXSIZE=10G runs.
          ccache --max-size="${CCACHE_MAXSIZE}" || true
          ccache --zero-stats || true

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: ./scripts/android_build.sh apk

      - name: Disk usage (post-build)
        if: always()
        run: |
          df -h
          du -sh .cache/ccache ~/.gradle android/.gradle android/build android/app/.cxx android/app/build 2>/dev/null || true

      - name: ccache stats (post-build)
        if: always()
        run: ccache --show-stats || true

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
