name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxfixes-dev libxrender-dev libxss-dev libgl-dev libssl-dev xvfb

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi

      - name: Restore ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-v1-

      - name: ccache stats (pre-build)
        if: runner.os != 'Windows'
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: Configure
        shell: bash
        run: |
          generator=()
          cmake_args=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            generator=(-G Ninja)
          else
            cmake_args=(
              -DCMAKE_C_COMPILER_LAUNCHER=ccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            )
          fi
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release "${generator[@]}" "${cmake_args[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j 2

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke run (Linux)
        if: runner.os == 'Linux'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          xvfb_pid=$!
          sleep 1
          set +e
          timeout 3 ./build/pp-browser
          code=$?
          kill "$xvfb_pid" 2>/dev/null || true
          wait "$xvfb_pid" 2>/dev/null || true
          test "$code" -eq 124

      - name: ccache stats (post-build)
        if: runner.os != 'Windows'
        run: ccache --show-stats || true

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: ./scripts/android_build.sh apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
