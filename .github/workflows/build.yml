name: build

# Release branches run the same checks as main (projects/release-compatibility DESIGN § Checks by level): their pushes,
# and PRs to them (backports, release-branch-only fixes) build every platform and run every test, not a PR's subset.
on:
  push:
    # The integration branch only: its work branches (cutover/w1-…) build through their PRs into it.
    branches: [main, 'release/**', 'cutover/signed-formats']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'projects/**'
      - 'design/**'
      - 'reports/**'
      - '.cursor/**'
      - '.vscode/**'
      - 'LICENSE'
  # Every PR runs this workflow, so the one required check (`required`, at the end) always reports; a docs-only PR
  # skips the jobs below it through the `code` filter instead of a paths-ignore.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Not PRs into the cutover integration branch: its work items run the full suite locally and are merged in
    # batches; the integration branch's push builds each batch once (CI time is short).
    branches: [main, 'release/**']
  # The backport bot (backport.yml) runs this on its backport/* branch: a PR it opens with the workflow token starts
  # no pull_request run. A dispatch runs everything, as a push does.
  workflow_dispatch:

# PB-060: read only. paths-filter lists a PR's files through the API; nothing here writes.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which jobs a PR needs (Kenneth 2026-10-20: every push ran all six jobs and queued behind each other).
  # Drafts run nothing; marking "ready for review" runs the set below. Pushes, dispatches and PRs to a release branch
  # run everything.
  changes:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      # Anything but docs changed (the push trigger's paths-ignore list); false skips every job on a docs-only PR.
      code: ${{ steps.code.outputs.code }}
      src: ${{ steps.filter.outputs.src }}
      apple: ${{ steps.filter.outputs.apple }}
      android: ${{ steps.filter.outputs.android }}
      # calls or anything below it, or the standalone root: the capabilities job (CR023 step 4).
      calls_standalone: ${{ steps.filter.outputs.calls_standalone }}
      # What the two pp-node editions are built from: the node-editions job (projects/node-relay NR2).
      node_editions: ${{ steps.filter.outputs.node_editions }}
      # The filters that matched, as a JSON list: the Test step reads the capability folders' from it.
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@v4
        id: code
        with:
          # A file counts as code when it matches every pattern, i.e. none of the docs paths.
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!projects/**'
              - '!design/**'
              - '!reports/**'
              - '!.cursor/**'
              - '!.vscode/**'
              - '!LICENSE'
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'capabilities/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'third_party/**'
              - 'scripts/**'
              - 'packaging/**'
              - 'android/**'
              - '.github/workflows/build.yml'
            apple:
              - 'src/foundation/platform/**'
              - 'src/**/*_Darwin.*'
              - 'src/**/*_Ios.*'
              - 'src/**/*_Apple.*'
              - 'src/**/*.mm'
              - 'src/**/CMakeLists.txt'
              - 'capabilities/**/*_Darwin.*'
              - 'capabilities/**/*_Ios.*'
              - 'capabilities/**/*_Apple.*'
              - 'capabilities/**/*.mm'
              - 'capabilities/**/CMakeLists.txt'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'third_party/**'
              - 'packaging/ios/**'
              - 'scripts/platform/ios*'
              - '.github/workflows/build.yml'
            android:
              - 'android/**'
              - 'src/**'
              - 'capabilities/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'third_party/**'
              - '.github/workflows/build.yml'
            # A moved capability's tests (CTest label capability:<name>) run on a PR only when its folder or
            # something below it changed: the base (capabilities/base), cmake/, third_party/ and the
            # capabilities before it (projects/capability-repos CR022). Each filter is the one below it plus its
            # folder; the Test step lists the folders.
            base: &capability_base
              - 'capabilities/base/**'
              - 'src/CMakeLists.txt'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'third_party/**'
              - '.github/workflows/build.yml'
            # The headless product base both apps use (CR028); no capability builds on it.
            product:
              - *capability_base
              - 'capabilities/product/**'
            people: &people
              - *capability_base
              - 'capabilities/people/**'
            net: &net
              - *people
              - 'capabilities/net/**'
            social: &social
              - *people
              - 'capabilities/social/**'
            delivery: &delivery
              - *net
              - 'capabilities/delivery/**'
            pricing: &pricing
              - *delivery
              - 'capabilities/pricing/**'
            media: &media
              - *capability_base
              - 'capabilities/media/**'
            messaging: &messaging
              - *pricing
              - *social
              - *media
              - 'capabilities/messaging/**'
            calls: &calls
              - *pricing
              - *media
              - 'capabilities/calls/**'
            broadcast: &broadcast
              - *calls
              - 'capabilities/broadcast/**'
            node: &node
              - *net
              - 'capabilities/node/**'
            relay: &relay
              - *net
              - 'capabilities/relay/**'
            # pp-node and pp-node-plus: the capabilities they link, the node app, the product's base it reads, and how
            # they are packaged and checked.
            node_editions:
              - *node
              - *relay
              - 'capabilities/product/**'
              - 'src/app/node/**'
              - 'src/foundation/**'
              - 'src/common/**'
              - 'packaging/pp-node/**'
              - 'scripts/platform/pp_node_package_linux.sh'
              - 'scripts/check/check_node_size.sh'
              - 'scripts/test/pp_node_image_smoke.sh'
            # The standalone calls build (capabilities/CMakeLists.txt; the capabilities job): calls and what is below it.
            calls_standalone:
              - *calls
              - 'capabilities/CMakeLists.txt'

  lint:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Feature include edges
        run: ./scripts/check/check_feature_includes.sh
      - name: Domain include edges
        run: ./scripts/check/check_domain_includes.sh
      - name: Foundation/lib include edges
        run: |
          ./scripts/check/check_base_includes.sh
          ./scripts/check/check_base_public_libs.sh
      - name: Capability edges
        run: ./scripts/check/check_capability_edges.py
      - name: Owner runners
        run: ./scripts/check/check_owner_runners.sh
      - name: Platform ifdef locations
        run: ./scripts/check/check_platform_ifdefs.sh
      - name: RML text bindings
        run: ./scripts/check/check_rml_bindings.sh
      - name: Shareable channels (what Send diagnostics reads)
        run: ./scripts/check/check_shareable_channels.sh
      - name: pp-node dashboard is the generator's output
        run: python3 packaging/pp-node/monitoring/gen_grafana_dashboard.py | diff -u packaging/pp-node/monitoring/grafana-dashboard.json -
      - name: Release relay id check (SIGNED_FORMATS § 3.5)
        run: |
          # Its self-test reads pp-specs' relay certificate vectors, at the pinned tag (cmake/PpPins.cmake).
          export PP_SPECS_DIR="$(./scripts/dev/pp_specs_at_pin.sh "$RUNNER_TEMP/pp-specs")"
          ./scripts/check/check_relay_ids.sh --self-test
      - name: No private relay deployment detail (public repository)
        run: |
          ./scripts/check/check_private_infra.sh --self-test
          ./scripts/check/check_private_infra.sh
      # Only the self-test: the check itself still fails on main (hard-coded colours in components.rcss).
      - name: Theme colour check (self-test)
        run: python3 ./scripts/check/check_theme_colors.py --self-test
      - name: App lab selection (tags, --changed, the registry self-check)
        run: python3 -m unittest discover -s scripts/test -p '*_test.py'
      - name: C++ formatting (clang-format 23.1.5)
        run: |
          pipx install clang-format==23.1.5
          ./scripts/check/check_format.sh

  build:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos]

    # macOS runs on the self-hosted Mac (CI_MAC_BUILD_LABELS; hosted macos-15 when unset), except a fork PR's: its code
    # would run on that Mac as its user.
    runs-on: ${{ matrix.os != 'macos' && matrix.os || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_MAC_BUILD_LABELS || '"macos-15"') || 'macos-15') }}
    env:
      # Asset-only PRs (locales, themes, views) still need the tests, which the Ubuntu build runs; the
      # Windows and macOS builds add nothing for them. Pushes, and PRs to a release branch, always build everything.
      PP_RUN_PLATFORM: ${{ github.event_name != 'pull_request' || github.base_ref != 'main' || needs.changes.outputs.src == 'true' || matrix.os == 'ubuntu-24.04' }}
      CCACHE_COMPRESSLEVEL: 5

    steps:
      - uses: actions/checkout@v7
        if: env.PP_RUN_PLATFORM == 'true'

      - uses: ilammy/msvc-dev-cmd@v1
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'Windows')

      - name: Install Linux deps
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxfixes-dev libxrender-dev libxss-dev libgl-dev libdbus-1-dev libssl-dev libpulse-dev libasound2-dev xvfb

      - name: Install Windows deps
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'Windows')
        run: |
          # The Chocolatey community feed drops requests now and then ("Unable to find package 'nasm'",
          # 2026-10-19 twice in a row); the step used to carry on and Configure then failed with
          # "No CMAKE_ASM_NASM_COMPILER could be found". Retry, and fail here with the real reason.
          $nasmDir = "C:\Program Files\NASM"
          choco install nasm --no-progress -y
          if (-not (Test-Path "$nasmDir\nasm.exe")) {
            # Fallback: the official build from nasm.us (the feed was down for a whole afternoon once).
            Write-Host "Chocolatey did not install nasm; downloading from nasm.us"
            $ver = "2.16.03"
            $zip = "$env:RUNNER_TEMP\nasm.zip"
            Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/$ver/win64/nasm-$ver-win64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\nasm" -Force
            New-Item -ItemType Directory -Force -Path $nasmDir | Out-Null
            Copy-Item "$env:RUNNER_TEMP\nasm\nasm-$ver\*" $nasmDir -Recurse -Force
          }
          if (-not (Test-Path "$nasmDir\nasm.exe")) { throw "nasm is not installed (Chocolatey and nasm.us both failed)" }
          echo $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ccache on Windows: a pinned release kept in the Actions cache, so GitHub's release downloads (504 for an
      # afternoon on 2026-11-08, Chocolatey's package fetching from the same place) are needed once per version,
      # not per job. It only speeds the build up (~3 min instead of ~25): without it the job builds anyway.
      - name: Restore ccache tool (Windows)
        id: ccache-tool
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'Windows')
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.tools/ccache
          key: windows-ccache-tool-4.14.2

      - name: Install ccache (Windows)
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'Windows')
        run: |
          $cver = "4.14.2"
          $dir = "${{ github.workspace }}\.tools\ccache"
          if (-not (Test-Path "$dir\ccache.exe")) {
            try {
              $czip = "$env:RUNNER_TEMP\ccache.zip"
              Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$cver/ccache-$cver-windows-x86_64.zip" -OutFile $czip
              Expand-Archive -Path $czip -DestinationPath "$env:RUNNER_TEMP\ccache" -Force
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              Copy-Item "$env:RUNNER_TEMP\ccache\ccache-$cver-windows-x86_64\*" $dir -Recurse -Force
            } catch {
              Write-Warning "ccache $cver could not be downloaded ($_): building without a compiler cache"
            }
          }
          if (Test-Path "$dir\ccache.exe") {
            echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install macOS deps
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'macOS')
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi

      - name: Ensure ccache directory exists
        if: env.PP_RUN_PLATFORM == 'true'
        shell: bash
        run: |
          mkdir -p .cache/ccache
          echo "CCACHE_DIR=${{ github.workspace }}/.cache/ccache" >> "$GITHUB_ENV"

      - name: Runner image (ccache key)
        if: env.PP_RUN_PLATFORM == 'true'
        shell: bash
        # ccache misses everything after a compiler change, so a new runner image starts its own cache
        # (falling back to the newest one); a self-hosted runner has no image version.
        run: echo "PP_RUNNER_IMAGE=${ImageOS:-self-hosted}-${ImageVersion:-none}" >> "$GITHUB_ENV"

      - name: Restore ccache
        if: env.PP_RUN_PLATFORM == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-v2-${{ env.PP_RUNNER_IMAGE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-v2-${{ env.PP_RUNNER_IMAGE }}-
            ${{ runner.os }}-ccache-v2-

      - name: ccache stats (pre-build)
        if: env.PP_RUN_PLATFORM == 'true'
        shell: bash
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: Configure
        if: env.PP_RUN_PLATFORM == 'true'
        shell: bash
        run: |
          generator=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            generator=(-G Ninja)
          fi
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_COMPILER_CACHE=ON \
            "${generator[@]}"

      - name: Build
        if: env.PP_RUN_PLATFORM == 'true'
        shell: bash
        run: cmake --build build --config Release -j "$(cmake -P cmake/HostCores.cmake)"

      - name: Test
        if: env.PP_RUN_PLATFORM == 'true'
        shell: bash
        env:
          TRACE_DEBUG: "1"
          # A PR to main skips the tests of the capability folders it does not touch (CR022); pushes and PRs to a
          # release branch run every test.
          # -j (no count, CMake 3.29+): one test per core. Serial took 9 min on macOS; the slow call tests mostly wait on timers.
          PP_IS_PR: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
          PP_CHANGED_FILTERS: ${{ needs.changes.outputs.changes }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # A home of its own: on the self-hosted Mac the runner is the Mac's user, whose ~/Library a test must not
            # reach (one falling back to the default data dir, say).
            export HOME="$RUNNER_TEMP/test-home"
            mkdir -p "$HOME"
          fi
          skip=()
          if [ "$PP_IS_PR" = true ]; then
            for capability in base product people net social delivery pricing media messaging calls broadcast node relay; do
              case "$PP_CHANGED_FILTERS" in
                *"\"$capability\""*) ;;
                *) skip+=("$capability") ;;
              esac
            done
          fi
          if [ ${#skip[@]} -gt 0 ]; then
            echo "Unchanged capabilities, tests skipped: ${skip[*]}"
            ctest --test-dir build -C Release -j --output-on-failure -LE "^capability:($(IFS='|'; echo "${skip[*]}"))\$"
          else
            ctest --test-dir build -C Release -j --output-on-failure
          fi

      - name: Smoke run (Linux)
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'Linux')
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          xvfb_pid=$!
          sleep 1
          set +e
          timeout 3 ./build/src/app/pp-browser
          code=$?
          kill "$xvfb_pid" 2>/dev/null || true
          wait "$xvfb_pid" 2>/dev/null || true
          test "$code" -eq 124

      - name: ccache stats (post-build)
        if: env.PP_RUN_PLATFORM == 'true' && (always())
        shell: bash
        run: ccache --show-stats || true

  # Downloadable Linux build of every main push (no tests: the build job runs them). Packaged
  # layout (bin/ + share/pp-browser/assets); no backend URL is compiled in, set PP_BROWSER_ORIGIN at run time.
  linux-package:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      CCACHE_COMPRESSLEVEL: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxfixes-dev libxrender-dev libxss-dev libgl-dev libdbus-1-dev libssl-dev libpulse-dev libasound2-dev

      - name: Ensure ccache directory exists
        run: |
          mkdir -p .cache/ccache
          echo "CCACHE_DIR=${{ github.workspace }}/.cache/ccache" >> "$GITHUB_ENV"

      - name: Runner image (ccache key)
        shell: bash
        # ccache misses everything after a compiler change, so a new runner image starts its own cache
        # (falling back to the newest one); a self-hosted runner has no image version.
        run: echo "PP_RUNNER_IMAGE=${ImageOS:-self-hosted}-${ImageVersion:-none}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-v2-${{ env.PP_RUNNER_IMAGE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-v2-${{ env.PP_RUNNER_IMAGE }}-
            ${{ runner.os }}-ccache-v2-

      - name: Configure
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_COMPILER_CACHE=ON \
            -DPP_BROWSER_PACKAGED_BUILD=ON \
            -DPP_RELAY_CONTENT_SHA256=${{ vars.PP_RELAY_CONTENT_SHA256 || 'OFF' }}

      - name: Build
        run: cmake --build build --target pp-browser -j "$(cmake -P cmake/HostCores.cmake)"

      - name: Install and pack
        run: |
          # `cmake --install` also runs the dependencies' install rules, whose libraries this job does not build.
          dest=stage/pp-browser-linux-x86_64
          install -D -s build/src/app/pp-browser "$dest/bin/pp-browser"
          mkdir -p "$dest/share/pp-browser"
          cp -r assets "$dest/share/pp-browser/assets"
          tar -C stage -czf "pp-browser-linux-x86_64-${GITHUB_SHA::8}.tar.gz" pp-browser-linux-x86_64

      # An artifact name takes no '/': release/app-1.1 → release-app-1.1.
      - name: Artifact name
        run: echo "PP_REF_SLUG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pp-browser-linux-${{ env.PP_REF_SLUG }}
          path: pp-browser-linux-x86_64-*.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.ref_name == 'main' && 90 || 14 }}

      # Retention alone does not cap the count: keep the newest 10 (main).
      - name: Prune old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ github.ref_name == 'main' && 10 || 5 }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=pp-browser-linux-${PP_REF_SLUG}&per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | .id' \
            | tail -n +$((KEEP + 1)) \
            | while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; done

  # iOS compile check (no signing, no device): the Apple-only sources (*_Ios.*, Objective-C++ without
  # ARC, the iOS CMake branches) were invisible to CI; two iOS-only compile errors reached develop in
  # October 2026. Mirrors `scripts/platform/ios_build.sh configure-device` + `build`, Ninja tree.
  # Defaults to hosted macos-15; the repo variable CI_MAC_BUILD_LABELS points it at the self-hosted Mac
  # (Xcode 27 / iOS 26+ SDK), which the hosted image cannot match for ASC SDK rules.
  ios:
    needs: changes
    # Fork PRs never reach the self-hosted Mac: their code would run on it.
    if: github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' && (github.base_ref != 'main' || needs.changes.outputs.apple == 'true') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON(vars.CI_MAC_BUILD_LABELS || '"macos-15"') }}
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESSLEVEL: 5

    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: |
          for tool in ccache ninja; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              brew install "$tool"
            fi
          done
          mkdir -p "$CCACHE_DIR"

      - name: Runner image (ccache key)
        shell: bash
        # ccache misses everything after a compiler change, so a new runner image starts its own cache
        # (falling back to the newest one); a self-hosted runner has no image version.
        run: echo "PP_RUNNER_IMAGE=${ImageOS:-self-hosted}-${ImageVersion:-none}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-ios-ccache-v1-${{ env.PP_RUNNER_IMAGE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ios-ccache-v1-${{ env.PP_RUNNER_IMAGE }}-
            ${{ runner.os }}-ios-ccache-v1-

      - name: ccache stats (pre-build)
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: Configure (iphoneos SDK, Ninja)
        run: |
          cmake -S . -B out-ios/build/device -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DPP_BROWSER_IOS_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_PACKAGED_BUILD=ON \
            -DPP_BROWSER_BUILD_TESTS=OFF \
            -DPP_BROWSER_COMPILER_CACHE=ON

      - name: Build pp-browser
        run: cmake --build out-ios/build/device --config Release -j "$(cmake -P cmake/HostCores.cmake)" --target pp-browser

      - name: ccache stats (post-build)
        if: always()
        run: ccache --show-stats || true

  android:
    needs: changes
    if: github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' && (github.base_ref != 'main' || needs.changes.outputs.android == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      # Set before setup-java / Gradle daemon so native builds inherit ccache config.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_COMPILERCHECK: string:android-ndk-r28.0.13004108
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
      # ubuntu-24.04 runners now have ~86 GB free out of the box; no cleanup step needed.
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESSLEVEL: 5
      ORG_GRADLE_PROJECT_ppBrowserCompilerCache: ON
      # Trim ccache working set to one ABI in CI; full set stays default for local/release builds.
      ORG_GRADLE_PROJECT_ppBrowserAbiFilters: arm64-v8a
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;28.0.13004108'

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Ensure Android cache directories exist
        run: |
          mkdir -p "$CCACHE_DIR"
          mkdir -p "$HOME/.gradle/caches"
          mkdir -p "$HOME/.gradle/wrapper"
          mkdir -p "$GITHUB_WORKSPACE/android/.gradle"
          chmod -R u+rwX "$CCACHE_DIR" "$HOME/.gradle" "$GITHUB_WORKSPACE/android/.gradle"

      - name: Restore Android Gradle cache
        uses: actions/cache@v6
        with:
          # Intentionally omit android/build and android/app/.cxx — large intermediates
          # that often exhaust runner disk when restored.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-android-gradle-v3-${{ hashFiles('android/build.gradle*', 'android/settings.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-v3-

      - name: Runner image (ccache key)
        shell: bash
        # ccache misses everything after a compiler change, so a new runner image starts its own cache
        # (falling back to the newest one); a self-hosted runner has no image version.
        run: echo "PP_RUNNER_IMAGE=${ImageOS:-self-hosted}-${ImageVersion:-none}" >> "$GITHUB_ENV"

      - name: Restore Android ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-ccache-v5-${{ env.PP_RUNNER_IMAGE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'android/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-android-ccache-v5-${{ env.PP_RUNNER_IMAGE }}-
            ${{ runner.os }}-android-ccache-v5-

      - name: Disk usage (pre-build)
        run: |
          df -h
          du -sh .cache/ccache ~/.gradle android/.gradle 2>/dev/null || true

      - name: ccache stats (pre-build)
        run: |
          echo "=== restored ccache (before zero-stats) ==="
          ccache --show-stats || true
          ccache --print-config 2>/dev/null || true
          # Cap any oversized restored cache from older CCACHE_MAXSIZE=10G runs.
          ccache --max-size="${CCACHE_MAXSIZE}" || true
          ccache --zero-stats || true

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
        run: ./scripts/platform/android_build.sh apk

      - name: Disk usage (post-build)
        if: always()
        run: |
          df -h
          du -sh .cache/ccache ~/.gradle android/.gradle android/build android/app/.cxx android/app/build 2>/dev/null || true

      - name: ccache stats (post-build)
        if: always()
        run: ccache --show-stats || true

      # An artifact name takes no '/': release/app-1.1 → release-app-1.1.
      - name: Artifact name
        run: echo "PP_REF_SLUG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # PR builds keep the shared name and expire fast; pushes get a per-branch name to prune.
          name: ${{ github.event_name == 'push' && format('android-debug-apk-{0}', env.PP_REF_SLUG) || 'android-debug-apk' }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || github.ref_name == 'main' && 90 || 14 }}

      - name: Prune old APKs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ github.ref_name == 'main' && 10 || 5 }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=android-debug-apk-${PP_REF_SLUG}&per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | .id' \
            | tail -n +$((KEEP + 1)) \
            | while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; done

  # Calls on its own (projects/capability-repos CR023 step 4): the standalone configure of capabilities/ with calls and
  # what is below it — no app — builds calls' tests and runs them (label capability:calls). A link to something above
  # calls fails its configure. Linux only. Release and the build job's tree layout, so its ccache (restored, never
  # saved here) serves most objects.
  capabilities:
    needs: changes
    if: github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' && (github.base_ref != 'main' || needs.changes.outputs.calls_standalone == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_COMPRESSLEVEL: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux deps
        # The build job's packages: SDL configures the same, so the objects match its cache.
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxfixes-dev libxrender-dev libxss-dev libgl-dev libdbus-1-dev libssl-dev libpulse-dev libasound2-dev

      - name: Ensure ccache directory exists
        run: |
          mkdir -p .cache/ccache
          echo "CCACHE_DIR=${{ github.workspace }}/.cache/ccache" >> "$GITHUB_ENV"

      - name: Runner image (ccache key)
        run: echo "PP_RUNNER_IMAGE=${ImageOS:-self-hosted}-${ImageVersion:-none}" >> "$GITHUB_ENV"

      - name: Restore ccache (the build job's)
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-v2-${{ env.PP_RUNNER_IMAGE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-v2-${{ env.PP_RUNNER_IMAGE }}-
            ${{ runner.os }}-ccache-v2-

      - name: Configure (capabilities/, calls)
        run: |
          ccache --zero-stats || true
          cmake -B build -S capabilities -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_COMPILER_CACHE=ON \
            -DPP_CAPABILITIES=calls

      - name: Build calls' tests
        run: cmake --build build --target pp_capability_calls_tests -j "$(cmake -P cmake/HostCores.cmake)"

      - name: Test (capability:calls)
        env:
          TRACE_DEBUG: "1"
        run: ctest --test-dir build -j --output-on-failure -L '^capability:calls$'

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

  # The two pp-node editions (projects/node-relay NR001, NR2): the headless Release build the release ships
  # (scripts/platform/pp_node_package_linux.sh), pp-node and pp-node-plus from one tree. Their link checks run at
  # configure and after each link: the default pp-node may not link the add-on services, pp-node-plus must have them.
  # Then the default node's size budget (binary and image), and each image's L0 smoke. Images are built here, not pushed.
  node-editions:
    needs: changes
    if: github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' && (github.base_ref != 'main' || needs.changes.outputs.node_editions == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_COMPRESSLEVEL: 5
      PP_NODE_BUILD_DIR: ${{ github.workspace }}/build-pp-node
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        # release-pp-node.yml's, so its ccache serves this build.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache pkg-config \
            python3 ca-certificates binutils curl file

      - name: Ensure ccache directory exists
        run: mkdir -p "$CCACHE_DIR"

      - name: Runner image (ccache key)
        run: echo "PP_RUNNER_IMAGE=${ImageOS:-self-hosted}-${ImageVersion:-none}" >> "$GITHUB_ENV"

      - name: Restore ccache (the node release's)
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-pp-node-ubuntu2404-ccache-v1-${{ env.PP_RUNNER_IMAGE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/release-pp-node.yml', 'scripts/platform/pp_node_package_linux.sh') }}
          restore-keys: |
            linux-pp-node-ubuntu2404-ccache-v1-${{ env.PP_RUNNER_IMAGE }}-
            linux-pp-node-ubuntu2404-ccache-v1-

      - name: Build and package pp-node
        run: |
          ccache --zero-stats || true
          PP_NODE_OUT_DIR=dist/pp-node bash scripts/platform/pp_node_package_linux.sh all

      - name: Build and package pp-node-plus
        env:
          PP_NODE_BINARY: pp-node-plus
          PP_NODE_OUT_DIR: dist/pp-node-plus
        run: |
          bash scripts/platform/pp_node_package_linux.sh build
          bash scripts/platform/pp_node_package_linux.sh package

      - name: Build both images (not pushed)
        run: |
          docker build -q -t pp-node:ci dist/pp-node/docker
          docker build -q -t pp-node-plus:ci dist/pp-node-plus/docker

      - name: The default pp-node's size
        run: ./scripts/check/check_node_size.sh dist/pp-node/docker/pp-node pp-node:ci

      - name: L0 image smoke (both)
        run: |
          set -euo pipefail
          for edition in node plus; do
            image="pp-node:ci" services=ledger
            [ "$edition" = plus ] && image="pp-node-plus:ci" services=ledger,relay
            docker rm -f pp-node-ci-smoke >/dev/null 2>&1 || true
            docker run -d --name pp-node-ci-smoke \
              -e PP_BROWSER_PIN=ci-smoke-pin \
              -e PP_NODE_AMP_UDP_PORT=18517 \
              -e PP_NODE_STATUS_ADDR=0.0.0.0:18518 \
              -p 18518:18518 \
              "$image"
            if ! PP_NODE_STATUS_URL=http://127.0.0.1:18518 \
                bash scripts/test/pp_node_image_smoke.sh --timeout 60 --expect-edition "$edition" \
                  --expect-services "$services"; then
              docker logs pp-node-ci-smoke || true
              exit 1
            fi
            docker logs pp-node-ci-smoke 2>&1 | grep -E 'pp-node.build|node services' || true
            docker rm -f pp-node-ci-smoke
          done

      # Any set an operator builds (cmake/PpNodeServices.cmake): no service, and each alone with what it needs. The
      # symbol checks hold each binary to exactly its set. Same tree: only main.cpp and the link rebuild.
      - name: Each service alone, and none
        run: |
          set -euo pipefail
          for set in "" ledger relay; do
            echo "::group::PP_NODE_SERVICES='$set'"
            cmake -B "$PP_NODE_BUILD_DIR" -DPP_NODE_SERVICES="$set" >/dev/null
            cmake --build "$PP_NODE_BUILD_DIR" --target pp-node -j "$(nproc)"
            echo "::endgroup::"
          done
          cmake -B "$PP_NODE_BUILD_DIR" -DPP_NODE_SERVICES=ledger >/dev/null

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

  # The one check branch protection requires (release-compatibility P2): it passes when every job above passed or was
  # skipped (a docs-only PR, a platform the PR does not touch), and fails on any failure or cancellation. A skipped
  # matrix job reports under its bare name, so the matrix checks themselves cannot be the required ones.
  required:
    needs: [changes, lint, build, ios, android, capabilities, node-editions]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' >/dev/null
