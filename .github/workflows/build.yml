name: build

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'projects/**'
      - 'design/**'
      - 'reports/**'
      - '.cursor/**'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'projects/**'
      - 'design/**'
      - 'reports/**'
      - '.cursor/**'
      - '.vscode/**'
      - 'LICENSE'

# PB-060: read only. paths-filter lists a PR's files through the API; nothing here writes.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which jobs a PR needs (Kenneth 2026-10-20: every push ran all six jobs and queued behind each other).
  # Drafts run nothing; marking "ready for review" runs the set below. Pushes to develop / main run everything.
  changes:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      src: ${{ steps.filter.outputs.src }}
      apple: ${{ steps.filter.outputs.apple }}
      android: ${{ steps.filter.outputs.android }}
      # The filters that matched, as a JSON list: the Test step reads the capability folders' from it.
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'capabilities/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'third_party/**'
              - 'scripts/**'
              - 'packaging/**'
              - 'android/**'
              - '.github/workflows/build.yml'
            apple:
              - 'src/foundation/platform/**'
              - 'src/**/*_Darwin.*'
              - 'src/**/*_Ios.*'
              - 'src/**/*_Apple.*'
              - 'src/**/*.mm'
              - 'src/**/CMakeLists.txt'
              - 'capabilities/**/*_Darwin.*'
              - 'capabilities/**/*_Ios.*'
              - 'capabilities/**/*_Apple.*'
              - 'capabilities/**/*.mm'
              - 'capabilities/**/CMakeLists.txt'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'third_party/**'
              - 'packaging/ios/**'
              - 'scripts/platform/ios*'
              - '.github/workflows/build.yml'
            android:
              - 'android/**'
              - 'src/**'
              - 'capabilities/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'third_party/**'
              - '.github/workflows/build.yml'
            # A moved capability's tests (CTest label capability:<name>) run on a PR only when its folder or
            # something below it changed: the base (capabilities/base), cmake/, third_party/ and the
            # capabilities before it (projects/capability-repos CR022). Each filter is the one below it plus its
            # folder; the Test step lists the folders.
            base: &capability_base
              - 'capabilities/base/**'
              - 'src/CMakeLists.txt'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'third_party/**'
              - '.github/workflows/build.yml'
            people: &people
              - *capability_base
              - 'capabilities/people/**'
            net: &net
              - *people
              - 'capabilities/net/**'
            social: &social
              - *people
              - 'capabilities/social/**'
            delivery: &delivery
              - *net
              - 'capabilities/delivery/**'
            pricing: &pricing
              - *delivery
              - 'capabilities/pricing/**'
            media: &media
              - *capability_base
              - 'capabilities/media/**'
            messaging: &messaging
              - *pricing
              - *social
              - *media
              - 'capabilities/messaging/**'
            calls: &calls
              - *pricing
              - *media
              - 'capabilities/calls/**'
            broadcast: &broadcast
              - *calls
              - 'capabilities/broadcast/**'
            node: &node
              - *net
              - 'capabilities/node/**'

  lint:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Feature include edges
        run: ./scripts/check/check_feature_includes.sh
      - name: Domain include edges
        run: ./scripts/check/check_domain_includes.sh
      - name: Foundation/lib include edges
        run: |
          ./scripts/check/check_base_includes.sh
          ./scripts/check/check_base_public_libs.sh
      - name: Capability edges
        run: ./scripts/check/check_capability_edges.py
      - name: Owner runners
        run: ./scripts/check/check_owner_runners.sh
      - name: Platform ifdef locations
        run: ./scripts/check/check_platform_ifdefs.sh
      - name: RML text bindings
        run: ./scripts/check/check_rml_bindings.sh
      - name: Shareable channels (what Send diagnostics reads)
        run: ./scripts/check/check_shareable_channels.sh
      - name: C++ formatting (clang-format 23.1.5)
        run: |
          pipx install clang-format==23.1.5
          ./scripts/check/check_format.sh

  build:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]

    runs-on: ${{ matrix.os }}
    env:
      # Asset-only PRs (locales, themes, views) still need the tests, which the Ubuntu build runs; the
      # Windows and macOS builds add nothing for them. Pushes to develop / main always build everything.
      PP_RUN_PLATFORM: ${{ github.event_name != 'pull_request' || needs.changes.outputs.src == 'true' || matrix.os == 'ubuntu-24.04' }}
      CCACHE_COMPRESSLEVEL: 5

    steps:
      - uses: actions/checkout@v7
        if: env.PP_RUN_PLATFORM == 'true'

      - uses: ilammy/msvc-dev-cmd@v1
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'Windows')

      - name: Install Linux deps
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxfixes-dev libxrender-dev libxss-dev libgl-dev libdbus-1-dev libssl-dev libpulse-dev libasound2-dev xvfb

      - name: Install Windows deps
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'Windows')
        run: |
          # The Chocolatey community feed drops requests now and then ("Unable to find package 'nasm'",
          # 2026-10-19 twice in a row); the step used to carry on and Configure then failed with
          # "No CMAKE_ASM_NASM_COMPILER could be found". Retry, and fail here with the real reason.
          $nasmDir = "C:\Program Files\NASM"
          choco install nasm --no-progress -y
          if (-not (Test-Path "$nasmDir\nasm.exe")) {
            # Fallback: the official build from nasm.us (the feed was down for a whole afternoon once).
            Write-Host "Chocolatey did not install nasm; downloading from nasm.us"
            $ver = "2.16.03"
            $zip = "$env:RUNNER_TEMP\nasm.zip"
            Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/$ver/win64/nasm-$ver-win64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\nasm" -Force
            New-Item -ItemType Directory -Force -Path $nasmDir | Out-Null
            Copy-Item "$env:RUNNER_TEMP\nasm\nasm-$ver\*" $nasmDir -Recurse -Force
          }
          if (-not (Test-Path "$nasmDir\nasm.exe")) { throw "nasm is not installed (Chocolatey and nasm.us both failed)" }
          echo $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ccache on Windows: a pinned release kept in the Actions cache, so GitHub's release downloads (504 for an
      # afternoon on 2026-11-08, Chocolatey's package fetching from the same place) are needed once per version,
      # not per job. It only speeds the build up (~3 min instead of ~25): without it the job builds anyway.
      - name: Restore ccache tool (Windows)
        id: ccache-tool
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'Windows')
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.tools/ccache
          key: windows-ccache-tool-4.14.2

      - name: Install ccache (Windows)
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'Windows')
        run: |
          $cver = "4.14.2"
          $dir = "${{ github.workspace }}\.tools\ccache"
          if (-not (Test-Path "$dir\ccache.exe")) {
            try {
              $czip = "$env:RUNNER_TEMP\ccache.zip"
              Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$cver/ccache-$cver-windows-x86_64.zip" -OutFile $czip
              Expand-Archive -Path $czip -DestinationPath "$env:RUNNER_TEMP\ccache" -Force
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              Copy-Item "$env:RUNNER_TEMP\ccache\ccache-$cver-windows-x86_64\*" $dir -Recurse -Force
            } catch {
              Write-Warning "ccache $cver could not be downloaded ($_): building without a compiler cache"
            }
          }
          if (Test-Path "$dir\ccache.exe") {
            echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install macOS deps
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'macOS')
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi

      - name: Ensure ccache directory exists
        if: env.PP_RUN_PLATFORM == 'true'
        shell: bash
        run: |
          mkdir -p .cache/ccache
          echo "CCACHE_DIR=${{ github.workspace }}/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        if: env.PP_RUN_PLATFORM == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-v2-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-v2-

      - name: ccache stats (pre-build)
        if: env.PP_RUN_PLATFORM == 'true'
        shell: bash
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: Configure
        if: env.PP_RUN_PLATFORM == 'true'
        shell: bash
        run: |
          generator=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            generator=(-G Ninja)
          fi
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_COMPILER_CACHE=ON \
            "${generator[@]}"

      - name: Build
        if: env.PP_RUN_PLATFORM == 'true'
        shell: bash
        run: cmake --build build --config Release -j 4

      - name: Test
        if: env.PP_RUN_PLATFORM == 'true'
        shell: bash
        env:
          TRACE_DEBUG: "1"
          # A PR skips the tests of the capability folders it does not touch (CR022); pushes run every test.
          PP_IS_PR: ${{ github.event_name == 'pull_request' }}
          PP_CHANGED_FILTERS: ${{ needs.changes.outputs.changes }}
        run: |
          skip=()
          if [ "$PP_IS_PR" = true ]; then
            for capability in base people net social delivery pricing media messaging calls broadcast node; do
              case "$PP_CHANGED_FILTERS" in
                *"\"$capability\""*) ;;
                *) skip+=("$capability") ;;
              esac
            done
          fi
          if [ ${#skip[@]} -gt 0 ]; then
            echo "Unchanged capabilities, tests skipped: ${skip[*]}"
            ctest --test-dir build -C Release --output-on-failure -LE "^capability:($(IFS='|'; echo "${skip[*]}"))\$"
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: Smoke run (Linux)
        if: env.PP_RUN_PLATFORM == 'true' && (runner.os == 'Linux')
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          xvfb_pid=$!
          sleep 1
          set +e
          timeout 3 ./build/src/app/pp-browser
          code=$?
          kill "$xvfb_pid" 2>/dev/null || true
          wait "$xvfb_pid" 2>/dev/null || true
          test "$code" -eq 124

      - name: ccache stats (post-build)
        if: env.PP_RUN_PLATFORM == 'true' && (always())
        shell: bash
        run: ccache --show-stats || true

  # Downloadable Linux build of every develop / main push (no tests: the build job runs them). Packaged
  # layout (bin/ + share/pp-browser/assets); no backend URL is compiled in, set PP_BROWSER_ORIGIN at run time.
  linux-package:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      CCACHE_COMPRESSLEVEL: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxfixes-dev libxrender-dev libxss-dev libgl-dev libdbus-1-dev libssl-dev libpulse-dev libasound2-dev

      - name: Ensure ccache directory exists
        run: |
          mkdir -p .cache/ccache
          echo "CCACHE_DIR=${{ github.workspace }}/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-v2-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-v2-

      - name: Configure
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_COMPILER_CACHE=ON \
            -DPP_BROWSER_PACKAGED_BUILD=ON \
            -DPP_RELAY_CONTENT_SHA256=${{ vars.PP_RELAY_CONTENT_SHA256 || 'OFF' }}

      - name: Build
        run: cmake --build build --target pp-browser -j 4

      - name: Install and pack
        run: |
          # `cmake --install` also runs the dependencies' install rules, whose libraries this job does not build.
          dest=stage/pp-browser-linux-x86_64
          install -D -s build/src/app/pp-browser "$dest/bin/pp-browser"
          mkdir -p "$dest/share/pp-browser"
          cp -r assets "$dest/share/pp-browser/assets"
          tar -C stage -czf "pp-browser-linux-x86_64-${GITHUB_SHA::8}.tar.gz" pp-browser-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pp-browser-linux-${{ github.ref_name }}
          path: pp-browser-linux-x86_64-*.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.ref_name == 'main' && 90 || 14 }}

      # Retention alone does not cap the count: keep the newest 10 (main) / 5 (develop).
      - name: Prune old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ github.ref_name == 'main' && 10 || 5 }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=pp-browser-linux-${GITHUB_REF_NAME}&per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | .id' \
            | tail -n +$((KEEP + 1)) \
            | while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; done

  # iOS compile check (no signing, no device): the Apple-only sources (*_Ios.*, Objective-C++ without
  # ARC, the iOS CMake branches) were invisible to CI; two iOS-only compile errors reached develop in
  # October 2026. Mirrors `scripts/platform/ios_build.sh configure-device` + `build`, Ninja tree.
  # Defaults to hosted macos-15; the repo variable CI_MAC_BUILD_LABELS points it at the self-hosted Mac
  # (Xcode 27 / iOS 26+ SDK), which the hosted image cannot match for ASC SDK rules.
  ios:
    needs: changes
    # Fork PRs never reach the self-hosted Mac: their code would run on it.
    if: github.event_name != 'pull_request' || (needs.changes.outputs.apple == 'true' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON(vars.CI_MAC_BUILD_LABELS || '"macos-15"') }}
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESSLEVEL: 5

    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: |
          for tool in ccache ninja; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              brew install "$tool"
            fi
          done
          mkdir -p "$CCACHE_DIR"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-ios-ccache-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ios-ccache-v1-

      - name: ccache stats (pre-build)
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: Configure (iphoneos SDK, Ninja)
        run: |
          cmake -S . -B out-ios/build/device -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DPP_BROWSER_IOS_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_PACKAGED_BUILD=ON \
            -DPP_BROWSER_BUILD_TESTS=OFF \
            -DPP_BROWSER_COMPILER_CACHE=ON

      - name: Build pp-browser
        run: cmake --build out-ios/build/device --config Release -j 4 --target pp-browser

      - name: ccache stats (post-build)
        if: always()
        run: ccache --show-stats || true

  android:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      # Set before setup-java / Gradle daemon so native builds inherit ccache config.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_COMPILERCHECK: string:android-ndk-r28.0.13004108
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
      # ubuntu-24.04 runners now have ~86 GB free out of the box; no cleanup step needed.
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESSLEVEL: 5
      ORG_GRADLE_PROJECT_ppBrowserCompilerCache: ON
      # Trim ccache working set to one ABI in CI; full set stays default for local/release builds.
      ORG_GRADLE_PROJECT_ppBrowserAbiFilters: arm64-v8a
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;28.0.13004108'

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Ensure Android cache directories exist
        run: |
          mkdir -p "$CCACHE_DIR"
          mkdir -p "$HOME/.gradle/caches"
          mkdir -p "$HOME/.gradle/wrapper"
          mkdir -p "$GITHUB_WORKSPACE/android/.gradle"
          chmod -R u+rwX "$CCACHE_DIR" "$HOME/.gradle" "$GITHUB_WORKSPACE/android/.gradle"

      - name: Restore Android Gradle cache
        uses: actions/cache@v6
        with:
          # Intentionally omit android/build and android/app/.cxx — large intermediates
          # that often exhaust runner disk when restored.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-android-gradle-v3-${{ hashFiles('android/build.gradle*', 'android/settings.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-v3-

      - name: Restore Android ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-ccache-v5-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'android/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-android-ccache-v5-

      - name: Disk usage (pre-build)
        run: |
          df -h
          du -sh .cache/ccache ~/.gradle android/.gradle 2>/dev/null || true

      - name: ccache stats (pre-build)
        run: |
          echo "=== restored ccache (before zero-stats) ==="
          ccache --show-stats || true
          ccache --print-config 2>/dev/null || true
          # Cap any oversized restored cache from older CCACHE_MAXSIZE=10G runs.
          ccache --max-size="${CCACHE_MAXSIZE}" || true
          ccache --zero-stats || true

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
        run: ./scripts/platform/android_build.sh apk

      - name: Disk usage (post-build)
        if: always()
        run: |
          df -h
          du -sh .cache/ccache ~/.gradle android/.gradle android/build android/app/.cxx android/app/build 2>/dev/null || true

      - name: ccache stats (post-build)
        if: always()
        run: ccache --show-stats || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # PR builds keep the shared name and expire fast; develop / main get a per-branch name to prune.
          name: ${{ github.event_name == 'push' && format('android-debug-apk-{0}', github.ref_name) || 'android-debug-apk' }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || github.ref_name == 'main' && 90 || 14 }}

      - name: Prune old APKs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ github.ref_name == 'main' && 10 || 5 }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=android-debug-apk-${GITHUB_REF_NAME}&per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | .id' \
            | tail -n +$((KEEP + 1)) \
            | while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; done
