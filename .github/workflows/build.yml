name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxfixes-dev libxrender-dev libxss-dev libgl-dev libssl-dev xvfb

      - name: Configure
        shell: bash
        run: |
          generator=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            generator=(-G Ninja)
          fi
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release "${generator[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j 2

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke run (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a timeout 3 ./build/pp-browser || test $? -eq 124
