name: build

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'projects/**'
      - 'design/**'
      - 'reports/**'
      - '.cursor/**'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'projects/**'
      - 'design/**'
      - 'reports/**'
      - '.cursor/**'
      - '.vscode/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Feature include edges
        run: ./scripts/check/check_feature_includes.sh
      - name: Base/domain include edges
        run: |
          ./scripts/check/check_base_includes.sh
          ./scripts/check/check_base_public_libs.sh
      - name: Owner runners
        run: ./scripts/check/check_owner_runners.sh
      - name: Platform ifdef locations
        run: ./scripts/check/check_platform_ifdefs.sh
      - name: RML text bindings
        run: ./scripts/check/check_rml_bindings.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    runs-on: ${{ matrix.os }}
    env:
      CCACHE_COMPRESSLEVEL: 5

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxfixes-dev libxrender-dev libxss-dev libgl-dev libdbus-1-dev libssl-dev libpulse-dev libasound2-dev xvfb

      - name: Install Windows deps
        if: runner.os == 'Windows'
        run: |
          # The Chocolatey community feed drops requests now and then ("Unable to find package 'nasm'",
          # 2026-10-19 twice in a row); the step used to carry on and Configure then failed with
          # "No CMAKE_ASM_NASM_COMPILER could be found". Retry, and fail here with the real reason.
          $nasmDir = "C:\Program Files\NASM"
          choco install nasm --no-progress -y
          if (-not (Test-Path "$nasmDir\nasm.exe")) {
            # Fallback: the official build from nasm.us (the feed was down for a whole afternoon once).
            Write-Host "Chocolatey did not install nasm; downloading from nasm.us"
            $ver = "2.16.03"
            $zip = "$env:RUNNER_TEMP\nasm.zip"
            Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/$ver/win64/nasm-$ver-win64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\nasm" -Force
            New-Item -ItemType Directory -Force -Path $nasmDir | Out-Null
            Copy-Item "$env:RUNNER_TEMP\nasm\nasm-$ver\*" $nasmDir -Recurse -Force
          }
          if (-not (Test-Path "$nasmDir\nasm.exe")) { throw "nasm is not installed (Chocolatey and nasm.us both failed)" }
          echo $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install ccache --no-progress -y
          if (-not (Get-Command ccache -ErrorAction SilentlyContinue)) {
            # Same outage, same fallback: without ccache the Windows build takes ~25 min instead of ~3.
            Write-Host "Chocolatey did not install ccache; downloading from GitHub releases"
            $cver = "4.10.2"
            $czip = "$env:RUNNER_TEMP\ccache.zip"
            Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$cver/ccache-$cver-windows-x86_64.zip" -OutFile $czip
            Expand-Archive -Path $czip -DestinationPath "$env:RUNNER_TEMP\ccache" -Force
            echo "$env:RUNNER_TEMP\ccache\ccache-$cver-windows-x86_64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi

      - name: Ensure ccache directory exists
        shell: bash
        run: |
          mkdir -p .cache/ccache
          echo "CCACHE_DIR=${{ github.workspace }}/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-v2-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-v2-

      - name: ccache stats (pre-build)
        shell: bash
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: Configure
        shell: bash
        run: |
          generator=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            generator=(-G Ninja)
          fi
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_COMPILER_CACHE=ON \
            "${generator[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j 4

      - name: Test
        shell: bash
        env:
          TRACE_DEBUG: "1"
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke run (Linux)
        if: runner.os == 'Linux'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          xvfb_pid=$!
          sleep 1
          set +e
          timeout 3 ./build/src/app/pp-browser
          code=$?
          kill "$xvfb_pid" 2>/dev/null || true
          wait "$xvfb_pid" 2>/dev/null || true
          test "$code" -eq 124

      - name: ccache stats (post-build)
        if: always()
        shell: bash
        run: ccache --show-stats || true

  # iOS compile check (no signing, no device): the Apple-only sources (*_Ios.*, Objective-C++ without
  # ARC, the iOS CMake branches) were invisible to CI; two iOS-only compile errors reached develop in
  # October 2026. Mirrors `scripts/platform/ios_build.sh configure-device` + `build`, Ninja tree.
  ios:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESSLEVEL: 5

    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: |
          for tool in ccache ninja; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              brew install "$tool"
            fi
          done
          mkdir -p "$CCACHE_DIR"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-ios-ccache-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ios-ccache-v1-

      - name: ccache stats (pre-build)
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: Configure (iphoneos SDK, Ninja)
        run: |
          cmake -S . -B out-ios/build/device -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DPP_BROWSER_IOS_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPP_BROWSER_PACKAGED_BUILD=ON \
            -DPP_BROWSER_BUILD_TESTS=OFF \
            -DPP_BROWSER_COMPILER_CACHE=ON

      - name: Build pp-browser
        run: cmake --build out-ios/build/device --config Release -j 4 --target pp-browser

      - name: ccache stats (post-build)
        if: always()
        run: ccache --show-stats || true

  android:
    runs-on: ubuntu-24.04
    env:
      # Set before setup-java / Gradle daemon so native builds inherit ccache config.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CCACHE_COMPILERCHECK: string:android-ndk-r27.0.12077973
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
      # Keep well under GitHub-hosted runner free disk (~14GB before cleanup).
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESSLEVEL: 5
      ORG_GRADLE_PROJECT_ppBrowserCompilerCache: ON
      # Trim ccache working set to one ABI in CI; full set stays default for local/release builds.
      ORG_GRADLE_PROJECT_ppBrowserAbiFilters: arm64-v8a
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.0.12077973'

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Ensure Android cache directories exist
        run: |
          mkdir -p "$CCACHE_DIR"
          mkdir -p "$HOME/.gradle/caches"
          mkdir -p "$HOME/.gradle/wrapper"
          mkdir -p "$GITHUB_WORKSPACE/android/.gradle"
          chmod -R u+rwX "$CCACHE_DIR" "$HOME/.gradle" "$GITHUB_WORKSPACE/android/.gradle"

      - name: Restore Android Gradle cache
        uses: actions/cache@v6
        with:
          # Intentionally omit android/build and android/app/.cxx — large intermediates
          # that often exhaust runner disk when restored.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-android-gradle-v3-${{ hashFiles('android/build.gradle*', 'android/settings.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-v3-

      - name: Restore Android ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-ccache-v4-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'android/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-android-ccache-v4-

      - name: Disk usage (pre-build)
        run: |
          df -h
          du -sh .cache/ccache ~/.gradle android/.gradle 2>/dev/null || true

      - name: ccache stats (pre-build)
        run: |
          echo "=== restored ccache (before zero-stats) ==="
          ccache --show-stats || true
          ccache --print-config 2>/dev/null || true
          # Cap any oversized restored cache from older CCACHE_MAXSIZE=10G runs.
          ccache --max-size="${CCACHE_MAXSIZE}" || true
          ccache --zero-stats || true

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: ./scripts/platform/android_build.sh apk

      - name: Disk usage (post-build)
        if: always()
        run: |
          df -h
          du -sh .cache/ccache ~/.gradle android/.gradle android/build android/app/.cxx android/app/build 2>/dev/null || true

      - name: ccache stats (post-build)
        if: always()
        run: ccache --show-stats || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
