plugins {
    id 'com.android.application'
}

def googleServicesFile = file('google-services.json')
def enableFcm = googleServicesFile.exists()
def ppBrowserVersion = project.findProperty('ppBrowserVersion') ?: '0.1.0'
def ppBrowserReleaseVersion = project.findProperty('ppBrowserReleaseVersion') ?: ppBrowserVersion
def ppBrowserCompilerCache = (project.findProperty('ppBrowserCompilerCache') ?: 'OFF').toString().toUpperCase()
def ppBrowserCmakeArgs = [
    "-DANDROID_PLATFORM=android-24",
    "-DANDROID_STL=c++_static",
    "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
    "-DPP_BROWSER_VERSION=${ppBrowserVersion}",
    "-DPP_BROWSER_RELEASE_VERSION=${ppBrowserReleaseVersion}",
    "-DPP_BROWSER_COMPILER_CACHE=${ppBrowserCompilerCache}",
]
if (ppBrowserCompilerCache == 'ON') {
    ppBrowserCmakeArgs += [
        "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
        "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
    ]
}

android {
    namespace "dev.pp_browser.app"
    compileSdkVersion 35

    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId "dev.pp_browser.app"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName ppBrowserReleaseVersion
        buildConfigField "boolean", "ENABLE_FCM", enableFcm ? "true" : "false"
        externalNativeBuild {
            cmake {
                arguments(*ppBrowserCmakeArgs)
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
            if (enableFcm) {
                java.srcDirs += ['src/fcm/java']
            } else {
                java.srcDirs += ['src/nofcm/java']
            }
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.24.0+'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    if (enableFcm) {
        implementation platform('com.google.firebase:firebase-bom:33.7.0')
        implementation 'com.google.firebase:firebase-messaging'
    }
}

if (enableFcm) {
    apply plugin: 'com.google.gms.google-services'
}
