plugins {
    id 'com.android.application'
}

def googleServicesFile = file('google-services.json')
def enableFcm = googleServicesFile.exists()
def ppBrowserVersion = project.findProperty('ppBrowserVersion') ?: '1.0.0'
def ppBrowserReleaseVersion = project.findProperty('ppBrowserReleaseVersion') ?: '1.0.0-rc14'
def ppBrowserCompilerCache = (project.findProperty('ppBrowserCompilerCache') ?: 'OFF').toString().toUpperCase()
def ppBrowserAbiFilters = (project.findProperty('ppBrowserAbiFilters') ?: 'armeabi-v7a,arm64-v8a,x86_64').toString().split(',')
def ppBrowserCmakeArgs = [
    "-DANDROID_PLATFORM=android-24",
    "-DANDROID_STL=c++_static",
    "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
    "-DPP_BROWSER_VERSION=${ppBrowserVersion}",
    "-DPP_BROWSER_RELEASE_VERSION=${ppBrowserReleaseVersion}",
    "-DPP_BROWSER_COMPILER_CACHE=${ppBrowserCompilerCache}",
]
// UI demo app (plan DEV/PLAN-ui-demo-data.md): ./gradlew assembleRelease -PppBrowserUiDemo=true with
// PP_BROWSER_DEV_TOOLS=1. A separate app (applicationIdSuffix) with fake data and no backend address.
def ppBrowserUiDemo = (project.findProperty('ppBrowserUiDemo') ?: 'false').toString() == 'true'
def ppApiUrlProd = System.getenv('PP_API_URL_PROD') ?: ''
if (ppApiUrlProd && !ppBrowserUiDemo) {
    ppBrowserCmakeArgs += ["-DPP_API_URL_PROD=${ppApiUrlProd}"]
}
def ppApiUrlQa = System.getenv('PP_API_URL_QA') ?: ''
if (ppApiUrlQa && !ppBrowserUiDemo) {
    ppBrowserCmakeArgs += ["-DPP_API_URL_QA=${ppApiUrlQa}"]
}
def ppRelayContentSha256 = (System.getenv('PP_RELAY_CONTENT_SHA256') ?: 'OFF').toUpperCase()
ppBrowserCmakeArgs += ["-DPP_RELAY_CONTENT_SHA256=${ppRelayContentSha256}"]
if (ppBrowserUiDemo) {
    ppBrowserCmakeArgs += ["-DPP_BROWSER_UI_DEMO=ON"]
}
if (System.getenv('PP_BROWSER_DEV_TOOLS')) {
    ppBrowserCmakeArgs += ["-DPP_BROWSER_DEV_TOOLS=ON"] // developer builds only: Settings -> About -> Engine test
}
if (System.getenv('PP_BROWSER_DEV_PIN') && !ppBrowserUiDemo && !System.getenv('CI')) {
    // Developer builds only, as the Mac / iPhone install scripts do: the PIN is compiled in and the app unlocks
    // itself on a cold start. Never set in CI or for a release.
    ppBrowserCmakeArgs += ["-DPP_BROWSER_DEV_PIN=${System.getenv('PP_BROWSER_DEV_PIN')}"]
}
if (ppBrowserCompilerCache == 'ON') {
    ppBrowserCmakeArgs += [
        "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
        "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
    ]
}

android {
    namespace "dev.pp_browser.app"
    compileSdkVersion 35

    ndkVersion '28.0.13004108'

    defaultConfig {
        applicationId "dev.pp_browser.app"
        if (ppBrowserUiDemo) {
            applicationIdSuffix ".uidemo"
        }
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName ppBrowserReleaseVersion
        buildConfigField "boolean", "ENABLE_FCM", enableFcm ? "true" : "false"
        externalNativeBuild {
            cmake {
                arguments(*ppBrowserCmakeArgs)
                abiFilters(*ppBrowserAbiFilters)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    if (!ppBrowserUiDemo) {
        // assets/demo (fake chat pictures) ships only in the UI demo app.
        androidResources {
            // AGP's default list (adds <dir>_*) plus the demo directory.
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:demo'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
            if (enableFcm) {
                java.srcDirs += ['src/fcm/java']
            } else {
                java.srcDirs += ['src/nofcm/java']
            }
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.24.0+'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    if (enableFcm) {
        implementation platform('com.google.firebase:firebase-bom:33.7.0')
        implementation 'com.google.firebase:firebase-messaging'
    }
}

if (enableFcm) {
    apply plugin: 'com.google.gms.google-services'
}
