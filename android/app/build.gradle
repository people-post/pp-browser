plugins {
    id 'com.android.application'
}

def buildWithCMake = true
def ppBrowserVersion = project.findProperty('ppBrowserVersion') ?: '0.1.0'
def ppBrowserReleaseVersion = project.findProperty('ppBrowserReleaseVersion') ?: ppBrowserVersion
def ppBrowserCompilerCache = (project.findProperty('ppBrowserCompilerCache') ?: 'OFF').toString().toUpperCase()
def ppBrowserCmakeArgs = [
    "-DANDROID_PLATFORM=android-24",
    "-DANDROID_STL=c++_static",
    "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
    "-DPP_BROWSER_VERSION=${ppBrowserVersion}",
    "-DPP_BROWSER_RELEASE_VERSION=${ppBrowserReleaseVersion}",
    "-DPP_BROWSER_COMPILER_CACHE=${ppBrowserCompilerCache}",
]
if (ppBrowserCompilerCache == 'ON') {
    ppBrowserCmakeArgs += [
        "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
        "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
    ]
}

android {
    namespace "dev.pp_browser.app"
    compileSdkVersion 35

    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId "dev.pp_browser.app"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName ppBrowserReleaseVersion
        externalNativeBuild {
            cmake {
                arguments ppBrowserCmakeArgs
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Unsigned CI/local release APKs until a release keystore is configured.
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.24.0+'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
